name: astella

# Production-like stack. All application containers use their `prod` image
# target, run without source bind mounts and inherit the non-root image user.
# Local hot-reload defaults live in the standalone docker-compose.dev.yml.

x-api-build: &api-build
  context: .
  dockerfile: apps/api/Dockerfile
  target: prod

x-worker-build: &worker-build
  context: .
  dockerfile: workers/ai-worker/Dockerfile
  target: prod

x-role-bootstrap-environment: &role-bootstrap-environment
  POSTGRES_HOST: postgres
  POSTGRES_USER: ${POSTGRES_USER:-astella}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting the production stack}
  POSTGRES_DB: ${POSTGRES_DB:-astella}
  MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD:?Set MIGRATOR_PASSWORD in .env before starting the production stack}
  API_PASSWORD: ${API_PASSWORD:?Set API_PASSWORD in .env before starting the production stack}
  WORKER_PASSWORD: ${WORKER_PASSWORD:?Set WORKER_PASSWORD in .env before starting the production stack}

x-role-bootstrap-volumes: &role-bootstrap-volumes
  - ./infra/postgres/apply-roles.sh:/opt/astella/apply-roles.sh:ro
  - ./infra/postgres/roles.sql:/opt/astella/roles.sql:ro

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-astella}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting the production stack}
      POSTGRES_DB: ${POSTGRES_DB:-astella}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - astella_net

  # Runs on every deployment path, including existing data volumes.  The
  # first pass creates/rotates the roles and transfers legacy object ownership
  # before migrations run; the post-migration pass below grants new objects.
  #
  # One-shot (restart: "no"): the alpha flow (`./scripts/alpha-env-setup.sh up`,
  # via its run_one_shot) removes any stale container, re-creates it and waits
  # for it to exit before starting API/worker.
  role-bootstrap:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment: *role-bootstrap-environment
    volumes: *role-bootstrap-volumes
    entrypoint: ["/bin/sh", "/opt/astella/apply-roles.sh"]
    security_opt:
      - no-new-privileges:true
    networks:
      - astella_net

  # Migrations are automatic, but account seeding is intentionally separate.
  # One-shot (restart: "no"): the alpha flow removes and re-runs it on every
  # start to apply pending migrations, then waits for it to exit.
  migrate:
    build: *api-build
    user: node
    restart: "no"
    depends_on:
      role-bootstrap:
        condition: service_completed_successfully
    environment:
      DATABASE_URL_MIGRATOR: ${DATABASE_URL_MIGRATOR:?Set DATABASE_URL_MIGRATOR in .env before starting the production stack}
      NODE_ENV: production
    command: ["npm", "run", "db:migrate"]
    security_opt:
      - no-new-privileges:true
    networks:
      - astella_net

  # One-shot (restart: "no"): re-applies role grants on objects created by
  # the migrator; the alpha flow re-runs it on every start.
  role-grants:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *role-bootstrap-environment
      REQUIRE_RLS_DISABLED: "true"
    volumes: *role-bootstrap-volumes
    entrypoint: ["/bin/sh", "/opt/astella/apply-roles.sh"]
    security_opt:
      - no-new-privileges:true
    networks:
      - astella_net

  # Run explicitly:
  #   docker compose -f docker-compose.yml --profile seed run --rm seed-owner
  # seed.ts fails closed when either OWNER_EMAIL or OWNER_PASSWORD is absent and
  # never enables demo defaults. Uses `run --rm`, so the container is removed
  # immediately after seeding.
  seed-owner:
    profiles: ["seed"]
    build: *api-build
    user: node
    restart: "no"
    depends_on:
      role-grants:
        condition: service_completed_successfully
    environment:
      DATABASE_URL_API: ${DATABASE_URL_API:?Set DATABASE_URL_API in .env before starting the production stack}
      NODE_ENV: production
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
      OWNER_WORKSPACE: ${OWNER_WORKSPACE:-Personal Workspace}
    command: ["npm", "run", "db:seed"]
    security_opt:
      - no-new-privileges:true
    networks:
      - astella_net

  api:
    build: *api-build
    user: node
    restart: unless-stopped
    # 2026-09-29（P0-10 停机预算）：必须**大于**代码里的停机预算，否则编排器
    # 会在代码跑完之前 SIGKILL，优雅关闭形同虚设。
    # 代码预算：apps/api/src/lib/graceful-shutdown.ts:35-41 的 closeServer race
    # 上限 10s + apps/api/src/db/client.ts:462 的 queryClient.end({timeout:5})
    # 上限 5s = 最坏 15s。Docker 默认只有 10s（SIGTERM 后直接 SIGKILL），
    # 也就是说 DB 池的关闭**必然**被打断，这里给 20s（15s + 5s 余量）。
    # 改这两处代码的任一时间预算时，必须同步改这个值。
    stop_grace_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      role-grants:
        condition: service_completed_successfully
    environment:
      DATABASE_URL_API: ${DATABASE_URL_API:?Set DATABASE_URL_API in .env before starting the production stack}
      NODE_ENV: production
      PORT: 4000
      # The container may listen on all interfaces internally, but the host
      # publish below remains loopback-only by default.
      API_BIND_ADDRESS: ${API_INTERNAL_BIND_ADDRESS:-0.0.0.0}
      ASTELLA_CONTAINER_MODE: "true"
      ASTELLA_ALLOW_CONTAINER_WILDCARD: "true"
      ASTELLA_DESKTOP_PAIRING_KEY_ID: ${ASTELLA_DESKTOP_PAIRING_KEY_ID:-}
      ASTELLA_DESKTOP_PAIRING_SECRET: ${ASTELLA_DESKTOP_PAIRING_SECRET:-}
      ASTELLA_DOMAIN_SCHEMA_REVISION: ${ASTELLA_DOMAIN_SCHEMA_REVISION:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # 默认关闭：Next/API 内部转发不能证明客户端 X-Forwarded-For 未被伪造。
      # 只有外部代理已覆写 X-Forwarded-For 时才显式设置 TRUST_PROXY。
      TRUST_PROXY: ${TRUST_PROXY:-false}
      # companion grant 签名密钥：未配置时 grant 签发 fail-closed 503（turn-service.ts）。
      # 生产必须设置为强随机值（.env.example 已要求）。
      AUTH_SURFACE_MANIFEST_SECRET: ${AUTH_SURFACE_MANIFEST_SECRET:-}
      AUTH_RATE_LIMIT_STORE: ${AUTH_RATE_LIMIT_STORE:-postgres}
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-900000}
      AUTH_RATE_LIMIT_MAX_ATTEMPTS: ${AUTH_RATE_LIMIT_MAX_ATTEMPTS:-5}
      # Companion Center base capabilities ship together; provider/device
      # enhancements remain independently gated. Each service declares exactly the
      # flags it reads; api/worker defaults are enforced by
      # .github/scripts/verify-companion-capability-config.mjs (make verify).
      LEARNING_RUN_ENABLED: ${LEARNING_RUN_ENABLED:-false}
      CARD_GENERATION_V2_ENABLED: ${CARD_GENERATION_V2_ENABLED:-false}
      COMPANION_DIALOGUE_V1_ENABLED: ${COMPANION_DIALOGUE_V1_ENABLED:-true}
      COMPANION_VOICE_DIALOGUE_V1_ENABLED: ${COMPANION_VOICE_DIALOGUE_V1_ENABLED:-false}
      COMPANION_STREAMING_VOICE_V1_ENABLED: ${COMPANION_STREAMING_VOICE_V1_ENABLED:-false}
      COMPANION_JOURNEY_V2: ${COMPANION_JOURNEY_V2:-true}
      COMPANION_BRIDGE_V2: ${COMPANION_BRIDGE_V2:-true}
      COMPANION_MEMORY_VECTOR_V1: ${COMPANION_MEMORY_VECTOR_V1:-true}
      COMPANION_MEMORY_STAR_MAP_V1: ${COMPANION_MEMORY_STAR_MAP_V1:-true}
      COMPANION_PET_PROFILE_V1: ${COMPANION_PET_PROFILE_V1:-true}
      COMPANION_PROACTIVE_PERSONALIZED_V1: ${COMPANION_PROACTIVE_PERSONALIZED_V1:-true}
      COMPANION_SUMMARIZER_V1: ${COMPANION_SUMMARIZER_V1:-true}
      COMPANION_DAILY_SUMMARY_V1: ${COMPANION_DAILY_SUMMARY_V1:-true}
      AI_ALLOW_DOCKER_DESKTOP_SYNTHETIC_DNS: ${AI_ALLOW_DOCKER_DESKTOP_SYNTHETIC_DNS:-false}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      # AI platform config — all provider/capability config in one JSON file.
      AI_PLATFORMS_CONFIG: /app/config/ai-platforms.json
      # 运维面板（/admin）。**可选项**：留空或弱于 16 字符 → 面板不注册任何
      # 路由（fail closed）。刻意用 `:-` 而不是 `:?` —— 面板是可选能力，让整个
      # 生产栈因为它没配就拒绝启动属于过度耦合（对比同文件里 DATABASE_URL_API /
      # EDGE_TTS_AUTH_TOKEN 那种"缺了就不能跑"的必需项）。
      # 生成：openssl rand -hex 32
      ADMIN_PANEL_TOKEN: ${ADMIN_PANEL_TOKEN:-}
      ADMIN_PANEL_PATH: ${ADMIN_PANEL_PATH:-/admin}
      LEARNING_DRAFT_ENC_KEY: ${LEARNING_DRAFT_ENC_KEY:-}
      PROJECTION_CHECKPOINT_SECRET: ${PROJECTION_CHECKPOINT_SECRET:-}
      # provider 解析与 mock 回退护栏都在 worker（governance.ts 读
      # AI_REQUIRE_CONFIGURED_PROVIDER）；api 只需要 key 与平台配置路径。
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      OPENAI_COMPAT_API_KEY: ${OPENAI_COMPAT_API_KEY:-}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      BIGMODEL_API_KEY: ${BIGMODEL_API_KEY:-}
      TOKENRHYTHM_API_KEY: ${TOKENRHYTHM_API_KEY:-}
      # capabilities.agent_turn 当前走 opencode-go（deepseek-v4.1-flash），以
      # config/ai-platforms.json 为准；tokenrhythm（qwen3.8-flash）为备用。
      # 两个平台的 key 都必须透传——compose 只传显式列出的变量：2026-09-17 就因
      # 漏传 OPENCODE_GO_API_KEY 导致容器内解析为空 → 平台不可用 → 学习卡生成
      # fail-closed（与 Assessment Critic 同类事故）。切 provider 时同步改这里与
      # config/ai-platforms.json。
      OPENCODE_GO_API_KEY: ${OPENCODE_GO_API_KEY:-}
      # 方案 16：LearningRun 独立 Assessment Critic（OpenAI-compatible）。
      # 2026-09-15 审计 · 设计 P0-2：此前 prod 完全没有注入这三个变量，而 compose
      # 只把显式列出的变量传进容器 → run-critic 恒抛 CriticUnavailableError →
      # 所有 text/voice 评估 fail-closed 为 not_assessable，prod 永远拿不到
      # demonstrated。这里补齐注入；只设 URL 即可（KEY 空则回退 DASHSCOPE_API_KEY，
      # MODEL 空则默认 qwen-plus，见 apps/api/src/lib/assessment-critic-config.ts）。
      ASSESSMENT_CRITIC_URL: ${ASSESSMENT_CRITIC_URL:-}
      ASSESSMENT_CRITIC_KEY: ${ASSESSMENT_CRITIC_KEY:-}
      ASSESSMENT_CRITIC_MODEL: ${ASSESSMENT_CRITIC_MODEL:-qwen-plus}
      # 语音：SiliconFlow ASR（外部 API）+ edge-tts TTS（Docker 容器）
      EDGE_TTS_BASE_URL: ${EDGE_TTS_BASE_URL:-http://edge-tts:8080}
      EDGE_TTS_AUTH_TOKEN: ${EDGE_TTS_AUTH_TOKEN:?Set EDGE_TTS_AUTH_TOKEN in .env（edge-tts 与 api 必须一致）}
      # Private remote object storage for uploaded resources and exports
      STORAGE_MODE: remote
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-astella}
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./config:/app/config:ro
    networks:
      - astella_net

  worker:
    build: *worker-build
    user: node
    restart: unless-stopped
    # 2026-09-29（P0-10 停机预算）：worker 的在途 job drain 预算**远大于**
    # Docker 默认的 10s，不设 stop_grace_period 等于每次滚动更新都在 SIGKILL。
    # 代码预算（workers/ai-worker/src/index.ts）：
    #   1) :695 drain 预算 WORKER_DRAIN_TIMEOUT_MS 默认 45_000；
    #   2) :726-732 的 finally 在 drain **之后**才跑，且还没被计入任何预算：
    #      notifyConnection.end({timeout:2}) 2s + metricsServer.close() +
    #      closeDatabase()（src/db.ts:201 queryClient.end({timeout:5})）5s。
    #   最坏 45 + 2 + 5 = 52s，这里给 60s（52s + 8s 余量）。
    # 特别提醒：:689-692 注释里"交还 V2 租约、避免孤儿 job 永久卡住"的保护
    # 只有在这 60s 内跑完才成立——被 SIGKILL 就等于没有。
    # WORKER_DRAIN_TIMEOUT_MS 在下一行显式声明（值与代码默认一致），让停机预算
    # 在部署配置里可见；**调大它必须同步调大这里的 stop_grace_period**。
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      role-grants:
        condition: service_completed_successfully
    environment:
      DATABASE_URL_WORKER: ${DATABASE_URL_WORKER:?Set DATABASE_URL_WORKER in .env before starting the production stack}
      NODE_ENV: production
      # AI platform config — all provider/capability config in one JSON file.
      AI_PLATFORMS_CONFIG: /app/config/ai-platforms.json
      # AI P0-1（2026-09-15 审计）：生产栈拒绝 mock 回退——未配置 provider 时
      # fail-closed（抛 ai_provider_not_configured，不可重试），而不是把 mock 的
      # 固定假文本当作真实回复/记忆落库。dev 与桌面端不设此项，保留 mock 降级。
      AI_REQUIRE_CONFIGURED_PROVIDER: ${AI_REQUIRE_CONFIGURED_PROVIDER:-true}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      OPENAI_COMPAT_API_KEY: ${OPENAI_COMPAT_API_KEY:-}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      BIGMODEL_API_KEY: ${BIGMODEL_API_KEY:-}
      TOKENRHYTHM_API_KEY: ${TOKENRHYTHM_API_KEY:-}
      # capabilities.agent_turn 当前走 opencode-go（deepseek-v4.1-flash），以
      # config/ai-platforms.json 为准；tokenrhythm（qwen3.8-flash）为备用。
      # 两个平台的 key 都必须透传——compose 只传显式列出的变量：2026-09-17 就因
      # 漏传 OPENCODE_GO_API_KEY 导致容器内解析为空 → 平台不可用 → 学习卡生成
      # fail-closed（与 Assessment Critic 同类事故）。切 provider 时同步改这里与
      # config/ai-platforms.json。
      OPENCODE_GO_API_KEY: ${OPENCODE_GO_API_KEY:-}
      AI_ALLOW_DOCKER_DESKTOP_SYNTHETIC_DNS: ${AI_ALLOW_DOCKER_DESKTOP_SYNTHETIC_DNS:-false}
      # 2026-09-15 审计：API_INTERNAL_URL 已删除——唯一的 TS 读取方（learning_session_assess
      # handler）在 7be4ffe 退役，worker 现在没有任何 HTTP 客户端回连 API（出站只到
      # LLM/源站）。留着会让"worker 会回调 API"成为误导性契约。
      # Keep worker-side execution authorization aligned with the API. The
      # production stack enables the base Companion Center contract. Only the flags the worker
      # actually reads are declared here.
      COMPANION_DIALOGUE_V1_ENABLED: ${COMPANION_DIALOGUE_V1_ENABLED:-true}
      COMPANION_VOICE_DIALOGUE_V1_ENABLED: ${COMPANION_VOICE_DIALOGUE_V1_ENABLED:-false}
      # 制卡唯一的模型档位开关（39d W7-7 刀二之后）。**未设 = 确定性替身 = 生产直接拒发**：
      # `resolveCardGenerationV3Providers()` 在 NODE_ENV=production 且没显式
      # V3_ALLOW_DETERMINISTIC_PROVIDERS=1 时抛不可重试错误（L1 护栏，理由见
      # 39d-w71 §5 第 9 条）。也就是说这条链接线真模型之前，生产部署出不来卡。
      # 旧链那三把（CARD_GENERATION_V2_LLM / V2_STAGE_CONCURRENCY / V2_SPECULATIVE_PEDAGOGY）
      # 随四阶段链一起已经没有读取者，故从这份文件里删除。
      CARD_GENERATION_V3_PROVIDER: ${CARD_GENERATION_V3_PROVIDER:-deterministic}
      COMPANION_MEMORY_EXTRACTOR_V1: ${COMPANION_MEMORY_EXTRACTOR_V1:-true}
      COMPANION_MEMORY_VECTOR_V1: ${COMPANION_MEMORY_VECTOR_V1:-true}
      COMPANION_SUMMARIZER_V1: ${COMPANION_SUMMARIZER_V1:-true}
      COMPANION_DAILY_SUMMARY_V1: ${COMPANION_DAILY_SUMMARY_V1:-true}
      COMPANION_THOUGHTS_V1: ${COMPANION_THOUGHTS_V1:-true}
      # Private remote object storage shared with the API
      STORAGE_MODE: remote
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-astella}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKER_METRICS_PORT: ${WORKER_METRICS_PORT:-9100}
      # 优雅关停 drain 预算（ms）。值与 workers/ai-worker/src/index.ts:695 的
      # 45_000 默认一致，此处显式声明只是为了让**停机预算在部署配置里可审**：
      # 上面的 stop_grace_period: 60s = 45s drain + 2s notify + 5s db + 8s 余量。
      # 调大这个值而不同步调大 stop_grace_period，会重新引入 P0-10。
      WORKER_DRAIN_TIMEOUT_MS: ${WORKER_DRAIN_TIMEOUT_MS:-45000}
      # Handler budgets are independent of the 120s crash-recovery lease; active jobs renew it.
      WORKER_MODEL_TIMEOUT_MS: ${WORKER_MODEL_TIMEOUT_MS:-}
      WORKER_PROVIDER_TIMEOUT_MS: ${WORKER_PROVIDER_TIMEOUT_MS:-900000}
      WORKER_TIMEOUT_PARSE_SOURCE_MS: ${WORKER_TIMEOUT_PARSE_SOURCE_MS:-}
    ports:
      - "${WORKER_METRICS_BIND_ADDRESS:-127.0.0.1}:${WORKER_METRICS_PORT:-9100}:${WORKER_METRICS_PORT:-9100}"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const port=process.env.WORKER_METRICS_PORT || '9100'; fetch('http://127.0.0.1:'+port+'/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 12
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./config:/app/config:ro
    networks:
      - astella_net

  # edge-tts：TTS 服务（Docker 容器内运行，不依赖宿主 CLI）。
  # 暴露 OpenAI 协议 POST /v1/audio/speech（text → mp3），供 api 容器调用。
  edge-tts:
    build:
      context: .
      dockerfile: docker/edge-tts/Dockerfile
    user: nobody
    restart: unless-stopped
    environment:
      EDGE_TTS_AUTH_TOKEN: ${EDGE_TTS_AUTH_TOKEN:?Set EDGE_TTS_AUTH_TOKEN in .env（edge-tts 与 api 必须一致）}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    networks:
      - astella_net

# SEC-18 备注：PostgreSQL / 对象存储凭据目前经环境变量注入，`docker inspect` 可见。
# 单机部署风险可接受；迁到共享主机时应改用 Docker Secrets，并同步让应用代码支持
# 从 /run/secrets/<name> 读取——只加 secrets: 配置而不改代码不会生效。

volumes:
  postgres_data:

networks:
  astella_net:
    driver: bridge
