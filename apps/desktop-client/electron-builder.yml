appId: com.asklins.astella
# 产品名 2026-10-06 定为 **Astella**（中文名 拾星笔记），此前叫「理解引擎」。
# 这一层是"身份"：应用包名、可执行文件名、安装目录、产物文件名都取自它，
# 全部用 ASCII，避免 GitHub 资产 URL、NSIS 差分下载与 Squirrel.Mac 在中文
# 文件名上的边角问题。用户看到的名字另说——
#   - macOS Dock / 关于面板：mac.extendInfo.CFBundleDisplayName
#   - Windows 开始菜单与"已安装的应用"：apps/windows-installer/WindowsRegistration.cs
#   - 窗口标题与界面文案：渲染层自己的品牌名
productName: Astella
copyright: Copyright © 2026 Astella

# electron-updater 的更新源。客户端直连 GitHub Releases：
# 检查走 api.github.com，下载走 GitHub 的 CDN——**不经过 apps/api**，
# 所以更新带宽不落在自家服务器上，也不会因为自家 API 挂掉而更新不了。
# 这里只提供 owner/repo；真正的 Release 由 desktop-release.yml 以
# 「先建 Draft、资产传完再公开」的方式发布，避免更新器读到半成品。
publish:
  provider: github
  owner: asklins223
  repo: Astella

directories:
  output: release

files:
  - out/**/*
  # Defense in depth: production renderer builds already omit these archives.
  # Keep the package boundary explicit if an externally supplied out/ is used.
  - '!out/renderer/assets/3d{,/**/*}'
  # 语音识别模型是**用户自己在设置里下的附加功能**，不进安装包（2026-10）。
  # public 树里已经没有 models/ 了；这一条挡的是"有人又把一份拷回 public/"与
  # "用了一份外部提供的 out/"这两种情况——它们都会让安装包平白多 239MB。
  - '!out/renderer/models{,/**/*}'
  - package.json

asar: true
extraResources:
  - from: build/deployment.json
    to: deployment.json
compression: maximum

# `electron-builder.yml` 描述应用目录与平台产物；Windows 安装器另由独立项目构建。
# "这次打哪个架构"交给 package.json 里的 package:win:x64 / package:mac:arm64 / ...
# 以及 .github/workflows/desktop-package.yml——两处都用 `--win --x64` 这类命令行
# 开关覆盖，所以这里**故意不写 arch**，避免和脚本互相覆盖后打出没人要的架构。

mac:
  category: public.app-category.education
  target:
    - dmg
    - zip
  # 伴星语音输入要用麦克风。macOS 少了这条描述，系统弹窗根本不会出现，
  # TCC 直接把 getUserMedia 判拒 —— 只放开主进程的权限闸是不够的。
  #
  # CFBundleDisplayName 是 Dock 与"关于本应用"里显示的那行字：包名保持 ASCII 的
  # Astella（安装路径、可执行文件名、更新包都按它走），显示名用中文。
  # 换 appId 会让 macOS 把它当成一个新应用，麦克风授权要重新点一次——这是
  # 改名的一次性代价，TCC 的授权记录挂在 bundle id 上，没有绕开的办法。
  extendInfo:
    CFBundleDisplayName: 拾星笔记
    NSMicrophoneUsageDescription: 拾星笔记 需要用麦克风把你的话转给伴星。
  # electron-builder.config.cjs 在没有 Developer ID 时选择 ad-hoc 签名并
  # 关闭该模式的 hardened runtime；afterSign 设置稳定的跨版本更新要求。
  # 有 Developer ID 时使用下方 hardened runtime，可继续进行 Apple 公证。
  hardenedRuntime: true

win:
  # electron-builder 只产出 Electron 程序目录；Windows 安装器由独立 WPF 项目构建。
  target: dir
  # 桌面学习房是单窗口应用，不需要管理员权限。显式写 asInvoker 而不是留默认：
  # 提权会让安装程序往 Program Files 写，用户目录下的免安装包和绿色版都用不了。
  requestedExecutionLevel: asInvoker
  # 未配 CSC_LINK / CSC_KEY_PASSWORD 时产物必然未签名（见上方 mac 段的说明）。
  # 这一条只做"资源改写"：把图标、版本信息、文件描述写进 exe/安装器；不碰签名。
  # 关掉的话装出来的 exe 连图标都是 Electron 默认的那个。
  signAndEditExecutable: true

linux:
  category: Education
  target:
    - AppImage

# 图标在 apps/desktop-client/build/（electron-builder 的 buildResources 默认目录）：
  # icon.icns 给 macOS，icon.ico 给 Windows，icon.png 是 1024×1024 的母版。
  # 这三份是**入库**的——.gitignore 里那几条 `!apps/desktop-client/build/` 否定规则
  # 就是为它们存在的（原先路径写错成 apps/desktop/，一直没生效）。
  # 要换图标：改这三份即可，配置本身不用动。
#
# 产物名前缀用 ASCII 的 `astella`，而且**写死**而不是取 ${productName}：
#   - Release 资产名会直接进 latest.yml / latest-mac.yml 被客户端解析，
#     而 GitHub 资产 URL、Windows 的 NSIS 差分下载、macOS 的 ShipIt 都对
#     非 ASCII 文件名有各种边角问题（编码、URL 百分号转义）；
#   - 显示名（拾星笔记）与包名（Astella）是两件事，写死前缀以后不管显示名
#     怎么调，已经发出去的更新元数据里的文件名都不会跟着漂。
artifactName: astella-${version}-${os}-${arch}.${ext}
