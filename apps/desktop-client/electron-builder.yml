appId: com.asklins.ailearn
# 产品名 2026-10-04 定为「理解引擎」，这是**装完之后**用户看到的名字：
# 应用包名、窗口标题、开始菜单项、Dock 图标旁的标题都取自它。
productName: 理解引擎
copyright: Copyright © 2026 理解引擎

# electron-updater 的更新源。客户端直连 GitHub Releases：
# 检查走 api.github.com，下载走 GitHub 的 CDN——**不经过 apps/api**，
# 所以更新带宽不落在自家服务器上，也不会因为自家 API 挂掉而更新不了。
# 这里只提供 owner/repo；真正的 Release 由 desktop-release.yml 以
# 「先建 Draft、资产传完再公开」的方式发布，避免更新器读到半成品。
publish:
  provider: github
  owner: asklins223
  repo: ai-learning-system

directories:
  output: release

files:
  - out/**/*
  # Defense in depth: production renderer builds already omit these archives.
  # Keep the package boundary explicit if an externally supplied out/ is used.
  - '!out/renderer/assets/3d{,/**/*}'
  # 语音识别模型是**用户自己在设置里下的附加功能**，不进安装包（2026-10）。
  # public 树里已经没有 models/ 了；这一条挡的是"有人又把一份拷回 public/"与
  # "用了一份外部提供的 out/"这两种情况——它们都会让安装包平白多 239MB。
  - '!out/renderer/models{,/**/*}'
  - package.json

asar: true
compression: maximum

# `electron-builder.yml` 只回答"一个 target 长什么样"：出 nsis 安装包还是 dmg。
# "这次打哪个架构"交给 package.json 里的 package:win:x64 / package:mac:arm64 / ...
# 以及 .github/workflows/desktop-package.yml——两处都用 `--win --x64` 这类命令行
# 开关覆盖，所以这里**故意不写 arch**，避免和脚本互相覆盖后打出没人要的架构。

mac:
  category: public.app-category.education
  target:
    - dmg
    - zip
  # 伴星语音输入要用麦克风。macOS 少了这条描述，系统弹窗根本不会出现，
  # TCC 直接把 getUserMedia 判拒 —— 只放开主进程的权限闸是不够的。
  extendInfo:
    NSMicrophoneUsageDescription: 理解引擎 需要用麦克风把你的话转给伴星。
  # 签名**不写死**在这里，由环境变量决定——这是 macOS 自动更新能不能用的分水岭：
  # Squirrel.Mac 会校验「新旧两个 .app 的代码签名是否同一开发者」，未签名的应用
  # 会被拒（下载成功、安装失败）。Windows 的 NSIS 路线没有这个约束，未签名可用。
  #
  # 所以这里刻意不设 `identity: null` / `notarize: false`：那两条等于**主动关掉**
  # electron-builder 的签名与公证（schema 里 notarize 的语义是「是否禁用公证」）。
  # 保持默认即可自动适配两种情况：
  #   - 仓库没配 MAC_CSC_LINK / APPLE_ID 等 secret → 找不到证书，electron-builder
  #     自行跳过签名，产物未签名（desktop-package.yml 会设
  #     CSC_IDENTITY_AUTO_DISCOVERY=false 省掉翻证书库的功夫）；
  #   - 配上了 → 自动签名 + 自动公证，macOS 自动更新随之可用，无需改任何配置。
  # 目前仓库尚未配置这些 secret，所以产物仍是未签名的。

win:
  target:
    - target: nsis
      arch:
        - x64
  # 桌面学习房是单窗口应用，不需要管理员权限。显式写 asInvoker 而不是留默认：
  # 提权会让安装程序往 Program Files 写，用户目录下的免安装包和绿色版都用不了。
  requestedExecutionLevel: asInvoker
  # 未配 CSC_LINK / CSC_KEY_PASSWORD 时产物必然未签名（见上方 mac 段的说明）。
  # 这一条只做"资源改写"：把图标、版本信息、文件描述写进 exe/安装器；不碰签名。
  # 关掉的话装出来的 exe 连图标都是 Electron 默认的那个。
  signAndEditExecutable: true

linux:
  category: Education
  target:
    - AppImage

nsis:
  # 2026-10-04 由 oneClick: false 改为 true。
  #
  # 原来选"向导式"是为了让用户自己挑安装目录，但**向导式安装器在无人值守的
  # runner 上跑不了 /S**：它有一个 `PageEx custom` 的"选安装范围"页（nsDialogs 画的），
  # NSIS 静默模式会跳过绘制，可 MultiUser 的模式判定仍需要一次显式决策，于是安装器
  # 就那么一直等着——CI 上表现为安装 step 挂到超时，症状与"安装器坏了"完全一样。
  #
  # oneClick 模式没有那一页，/S 静默安装可靠（消费级 Electron 应用的通行做法：
  # VS Code / Slack / Notion 都是一键装）。同时省掉一次提权交互。
  # 代价：用户不能再自己挑安装目录，改为装到 %LOCALAPPDATA%\Programs\理解引擎。
  oneClick: true
  # 装完留一个开始菜单入口和桌面快捷方式。
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # 未签名的安装包被 SmartScreen 拦下时，"更多信息 → 仍要运行"这条路要能走通，
  # 前提是用户知道去哪找。
  shortcutName: 理解引擎

# 图标在 apps/desktop-client/build/（electron-builder 的 buildResources 默认目录）：
  # icon.icns 给 macOS，icon.ico 给 Windows，icon.png 是 1024×1024 的母版。
  # 这三份是**入库**的——.gitignore 里那几条 `!apps/desktop-client/build/` 否定规则
  # 就是为它们存在的（原先路径写错成 apps/desktop/，一直没生效）。
  # 要换图标：改这三份即可，配置本身不用动。
#
# 产物名刻意用 ASCII 的 `ailearn`，**不用** ${productName}：
#   - 产品名「理解引擎」只影响装完之后的显示名，与文件名无关；
#   - Release 资产名会直接进 latest.yml / latest-mac.yml 被客户端解析，
#     而 GitHub 资产 URL、Windows 的 NSIS 差分下载、macOS 的 ShipIt 都对
#     非 ASCII 文件名有各种边角问题（编码、URL 百分号转义）。
#   - 两者各取所需：显示名中文，文件名 ASCII。
artifactName: ailearn-${version}-${os}-${arch}.${ext}
