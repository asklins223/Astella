<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>运维控制台 · ailearn</title>
    <!-- 空 data URI：面板不需要站点图标，而浏览器默认会去打 /favicon.ico，
         在这个只注册了几条路由的服务上那是一条注定 404 的请求（CSP 的
         img-src 允许 data:，所以这里不会连带触发一次策略拒绝）。 -->
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/admin/styles.css" />
  </head>
  <body data-view="gate">
    <!-- 门厅舞台：3D 仪器挂在这里。进入面板后 canvas 会搬到各视图自己的
         舞台里（同一个 WebGL 上下文），扁平视图不挂场景。 -->
    <div class="gate-stage" id="gate-stage" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <!-- 启动闸：没有令牌就停在解锁层，连一次数据请求都不发。 -->
    <div class="gate" id="gate" data-state="locked">
      <form class="gate__card" id="gate-form" autocomplete="off">
        <div class="gate__mark" aria-hidden="true"><span></span></div>
        <p class="gate__eyebrow">ailearn · control deck</p>
        <h1 class="gate__title">运维控制台</h1>
        <p class="gate__hint">
          这个面板能读取跨空间的队列、审计与配置状态。请输入部署时设置的
          <code>ADMIN_PANEL_TOKEN</code>。
        </p>
        <div class="field">
          <label class="field__label" for="gate-token">运维令牌</label>
          <input
            class="field__input"
            id="gate-token"
            type="password"
            name="token"
            spellcheck="false"
            placeholder="••••••••••••••••"
            required
          />
        </div>
        <p class="gate__error" id="gate-error" role="alert" hidden></p>
        <button class="btn btn--primary btn--block" type="submit" id="gate-submit">
          <span>接入控制台</span>
        </button>
        <p class="gate__foot">
          令牌只保存在本标签页内存中，关闭页面即失效；不会写入 localStorage。
        </p>
      </form>
    </div>

    <!-- 主壳：顶部页签 + 内容区（没有左栏——仪器占主区，导航不该抢它的宽度） -->
    <div class="shell" id="shell" hidden>
      <header class="topbar">
        <div class="topbar__brand">
          <span class="topbar__mark" aria-hidden="true"></span>
          <span class="topbar__name">控制台</span>
          <span class="topbar__env" id="env-badge"></span>
        </div>
        <nav class="tabs" aria-label="面板视图">
          <button class="tab is-active" type="button" data-view="overview">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7.5 4.3v8.6L12 20.2 4.5 15.9V7.3z"/><path d="M12 8.2l3.6 2.1v4.2L12 16.6l-3.6-2.1v-4.2z"/></svg>
            <span>总览</span>
          </button>
          <button class="tab" type="button" data-view="queues">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16v4H4zM4 14h16v4H4z"/><path d="M7.5 8.5h.01M7.5 16h.01"/></svg>
            <span>任务与队列</span>
          </button>
          <button class="tab" type="button" data-view="logs">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5h14M5 10.5h9M5 15.5h14M5 20h7"/><path d="M17.5 9.5l2.5 2.5-2.5 2.5"/></svg>
            <span>日志</span>
          </button>
          <button class="tab" type="button" data-view="metrics">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h3.4l2.2-6 3.2 12 2.6-8 1.8 4h4.8"/></svg>
            <span>指标</span>
          </button>
          <button class="tab" type="button" data-view="config">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14"/><path d="M9.5 5v4M15 10v4M11 15v4"/></svg>
            <span>模型配置</span>
          </button>
        </nav>
        <div class="topbar__right">
          <span class="pulse" id="conn-pill" data-state="idle">
            <span class="pulse__dot" aria-hidden="true"></span>
            <span class="pulse__text" id="conn-text">就绪</span>
          </span>
          <span class="topbar__meta" id="uptime">—</span>
          <span class="topbar__meta topbar__meta--dim" id="release"></span>
          <span class="topbar__clock" id="clock" aria-hidden="true"></span>
          <button class="btn btn--icon" id="refresh" type="button" title="刷新当前视图">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 12a8 8 0 1 1-2.34-5.66" />
              <path d="M20 4v4h-4" />
            </svg>
            <span class="sr-only">刷新</span>
          </button>
          <button class="btn btn--ghost" id="lock" type="button">锁定</button>
        </div>
      </header>

      <main class="content" id="content" tabindex="-1"></main>
    </div>

    <!-- 应用绘制的确认框（不用原生 confirm） -->
    <div class="modal" id="modal" hidden>
      <div class="modal__scrim" data-close="1"></div>
      <div class="modal__card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <h2 class="modal__title" id="modal-title"></h2>
        <p class="modal__body" id="modal-body"></p>
        <div class="modal__actions">
          <button class="btn btn--ghost" type="button" data-close="1" id="modal-cancel">取消</button>
          <button class="btn btn--primary" type="button" id="modal-confirm">确定</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="/admin/app.js" type="module"></script>
  </body>
</html>
