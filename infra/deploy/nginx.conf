# 收起尾这件事见 docker-compose.deploy.yml 里 nginx 的 stop_grace_period：官方 nginx
# 镜像的 STOPSIGNAL 是 SIGQUIT（优雅退出），它会**等** SSE/WebSocket 自己结束，所以
# 宽限时间必须大于"下游 API 先关连接"所需的时间。真正硬性的收尾上限
# （worker_shutdown_timeout）只能在 main context 生效，而这里挂的是 conf.d（http
# context）——要加它得换一份 /etc/nginx/nginx.conf 并同步 CI bundle 清单，留作后续。

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}
server {
  listen 80 default_server;
  server_name _;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}
server {
  listen 443 ssl default_server;
  server_name _;
  ssl_certificate /etc/letsencrypt/live/astella-ip/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/astella-ip/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 25m;
  location = /metrics { return 404; }
  location / {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Replace client-supplied forwarding headers before enabling TRUST_PROXY.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }
}
