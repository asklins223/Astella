# Signed S3 requests retain Host and the exact canonical object path. No API proxy hop.
server {
  listen 9443 ssl;
  server_name _;
  ssl_certificate /etc/letsencrypt/live/astella-ip/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/astella-ip/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 50m;
  location / {
    proxy_pass http://backup-minio:9000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
  }
}
