services:
  api:
    environment:
      STORAGE_BACKUP_ENABLED: 'true'
      STORAGE_BACKUP_ENDPOINT: http://backup-minio:9000
      STORAGE_BACKUP_PUBLIC_ENDPOINT: ${STORAGE_BACKUP_PUBLIC_ENDPOINT:-https://103.106.191.159:9443}
      STORAGE_BACKUP_ACCESS_KEY_ID: ${STORAGE_BACKUP_ACCESS_KEY_ID:?Initialize backup credentials on the host}
      STORAGE_BACKUP_SECRET_ACCESS_KEY: ${STORAGE_BACKUP_SECRET_ACCESS_KEY:?Initialize backup credentials on the host}
      STORAGE_BACKUP_BUCKET: ${STORAGE_BACKUP_BUCKET:-astella-backup}
      STORAGE_BACKUP_BYTES_PER_SECOND: ${STORAGE_BACKUP_BYTES_PER_SECOND:-262144}
      STORAGE_BACKUP_INTERVAL_MS: ${STORAGE_BACKUP_INTERVAL_MS:-5000}
    volumes: [object_backup_queue:/var/lib/astella/object-backup-queue]
  worker:
    environment:
      STORAGE_BACKUP_ENABLED: 'true'
      STORAGE_BACKUP_ENDPOINT: http://backup-minio:9000
      STORAGE_BACKUP_PUBLIC_ENDPOINT: ${STORAGE_BACKUP_PUBLIC_ENDPOINT:-https://103.106.191.159:9443}
      STORAGE_BACKUP_ACCESS_KEY_ID: ${STORAGE_BACKUP_ACCESS_KEY_ID:?Initialize backup credentials on the host}
      STORAGE_BACKUP_SECRET_ACCESS_KEY: ${STORAGE_BACKUP_SECRET_ACCESS_KEY:?Initialize backup credentials on the host}
      STORAGE_BACKUP_BUCKET: ${STORAGE_BACKUP_BUCKET:-astella-backup}
      STORAGE_BACKUP_BYTES_PER_SECOND: ${STORAGE_BACKUP_BYTES_PER_SECOND:-262144}
      STORAGE_BACKUP_INTERVAL_MS: ${STORAGE_BACKUP_INTERVAL_MS:-5000}
  nginx:
    ports: ['9443:9443']
    volumes:
      - ./infra/deploy/nginx-storage-backup.conf:/etc/nginx/conf.d/storage-backup.conf:ro
  # Standby object store. Public data plane is TLS/S3 on :9443; console is private.
  backup-minio:
    image: ${BACKUP_IMAGE:?CI must provide BACKUP_IMAGE}
    command: server /data --console-address ':9001'
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${STORAGE_BACKUP_ACCESS_KEY_ID:?Initialize backup credentials on the host}
      MINIO_ROOT_PASSWORD: ${STORAGE_BACKUP_SECRET_ACCESS_KEY:?Initialize backup credentials on the host}
    volumes: [object_backup_data:/data]
    networks: [astella_net]
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 12
  backup-init:
    image: ${API_IMAGE:?CI must provide API_IMAGE}
    user: '0:0'
    depends_on:
      backup-minio: {condition: service_healthy}
    environment:
      MINIO_ROOT_USER: ${STORAGE_BACKUP_ACCESS_KEY_ID:?Initialize backup credentials on the host}
      MINIO_ROOT_PASSWORD: ${STORAGE_BACKUP_SECRET_ACCESS_KEY:?Initialize backup credentials on the host}
      S3_BUCKET: ${STORAGE_BACKUP_BUCKET:-astella-backup}
    working_dir: /app
    entrypoint: ['node']
    command: ['/app/scripts/storage-backup-init.mjs']
    volumes:
      - object_backup_queue:/queue
      - ./infra/deploy/storage-backup-init.mjs:/app/scripts/storage-backup-init.mjs:ro
    networks: [astella_net]
volumes:
  object_backup_data:
  object_backup_queue:
