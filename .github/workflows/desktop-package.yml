name: Desktop package

# 这个工作流**只打包**：装依赖 → 构建 → 出安装包 → 上传产物。
#
# 为什么不并进 desktop-client.yml：那边是质量闸（typecheck / vitest / 房间层守卫 /
# 装完冒烟），任何一个红了都拿不到产物。这里的存在意义是"先拿到一个能装、能双击
# 启动的包看看"，不该被一串还没跑通的门禁挡住。两边刻意不互相 depends_on——
# 质量闸挂了照样能出包，只是那个包别拿去发版。
#
# 手动跑（不带版本号）时用 release/version.json 里的版本；被 desktop-release.yml
# 以 v* tag 调用时，用 tag 里的版本。
#
# 无 Apple 证书时生成完整 ad-hoc 签名，并使用跨版本稳定的 designated requirement。
# macOS 首次打开仍可能需要在隐私与安全中允许；有证书时使用 Developer ID 和公证。
# Windows 未配置证书时由 NSIS 分发未签名包。

on:
  workflow_dispatch:
    inputs:
      mac_arch:
        description: macOS 架构
        type: choice
        default: arm64
        options:
          - arm64
          - x64
      version:
        description: 版本号（留空则用 release/version.json）
        type: string
        default: ""
  workflow_call:
    inputs:
      # ⚠️ 可复用工作流的 input 只支持 boolean / number / string——**没有 choice**
      # （`options` 是 workflow_dispatch 独有的）。下面写成 choice 会让整个
      # desktop-release.yml 在"解析被调用工作流"这一步就失败，症状是
      # `failed to parse called workflow ... Unexpected value 'choice'`，
      # 而且 run 里一个 job 都不出现。合法值由调用方保证（desktop-release.yml
      # 传的就是同一个 arm64 / x64 二选一）。
      mac_arch:
        description: macOS 架构（arm64 或 x64）
        type: string
        default: arm64
      version:
        description: 版本号（留空则用 release/version.json）
        type: string
        default: ""
    outputs:
      windows_version:
        description: Windows 实际构建版本
        value: ${{ jobs.windows.outputs.version }}
      macos_version:
        description: macOS 实际构建版本
        value: ${{ jobs.macos.outputs.version }}
      macos_arch:
        description: macOS 实际构建架构
        value: ${{ jobs.macos.outputs.arch }}

permissions:
  contents: read

concurrency:
  group: desktop-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # 出包用的渲染层变体，与 desktop-client.yml 的 package-smoke 保持一致：
  # 装出来的包要跟质量闸验过的是同一份界面。
  VITE_HOME_SCENE_VARIANT: v2
  DESKTOP_API_ORIGIN: ${{ secrets.DESKTOP_API_ORIGIN }}
  ASTELLA_DOMAIN_SCHEMA_REVISION: ${{ secrets.ASTELLA_DOMAIN_SCHEMA_REVISION }}

jobs:
  windows:
    name: Windows x64 (NSIS)
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            apps/desktop-client/package-lock.json
            packages/shared/package-lock.json
      - name: Install linked shared dependencies
        working-directory: packages/shared
        run: npm ci --no-audit --no-fund
      # @astella/shared 是 file: 依赖（file:../../packages/shared）。上一条装的是
      # 它**自己的**依赖，装在共享包目录里；这条把它装进 desktop-client 的
      # node_modules。少任何一条，electron-vite 都会在解析 @astella/shared 时
      # 拿到一份缺依赖的快照。
      - name: Install desktop-client dependencies
        working-directory: apps/desktop-client
        run: npm ci --no-audit --no-fund
      - name: Resolve desktop version
        id: version
        # Windows runner 的默认 shell 是 PowerShell，而这段是 bash 语法
        # （`[ -n … ]` / `$GITHUB_OUTPUT`）。不显式声明 shell 的话，PowerShell 会在
        # 第一行就报 `Missing '(' after 'if' in if statement`。
        shell: bash
        run: |
          node .github/scripts/desktop-version.mjs --check
          if [ -n "${{ inputs.version }}" ]; then
            node .github/scripts/desktop-version.mjs --set "${{ inputs.version }}"
          fi
          node .github/scripts/desktop-version.mjs --check
          echo "version=$(node -e "console.log(require('./release/version.json').version)")" >> "$GITHUB_OUTPUT"
          echo "Windows build version: $(node -e "console.log(require('./release/version.json').version)")"
      - name: Configure Windows signing
        # shell 必须显式声明：windows runner 默认是 pwsh，而下面这段是 bash
        # （`set -euo pipefail` / `[ -n … ]` / `$GITHUB_ENV`）。macOS runner 默认就是
        # bash，那一侧不需要这一行。
        shell: bash
        # ⚠️ 不能写成 `CSC_LINK: ${{ secrets.WIN_CSC_LINK }}`——secret 不存在时
        # GitHub 会把它渲染成**空字符串但仍然定义**，electron-builder 于是认为
        # "签名已配置"，去把空串当前缀证书路径解析：
        #   • empty password will be used for code signing  reason=CSC_KEY_PASSWORD is not defined
        #   ⨯ .../apps/desktop-client not a file
        # 两条日志都不指向真正的原因。所以只有 secret 真存在时才写进 GITHUB_ENV。
        run: |
          set -euo pipefail
          if [ -n "${{ secrets.WIN_CSC_LINK }}" ]; then
            echo "CSC_LINK=${{ secrets.WIN_CSC_LINK }}" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=${{ secrets.WIN_CSC_KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "Windows code signing: 已启用"
          else
            # 让 electron-builder 自己去找证书，找不到就干净地跳过。
            echo "CSC_IDENTITY_AUTO_DISCOVERY=true" >> "$GITHUB_ENV"
            echo "Windows code signing: 未配置，产物将未签名"
          fi
      - name: Build and package Windows installer
        # Write public HTTPS defaults before packaging; no API keys enter the app.
        working-directory: apps/desktop-client
        # ⚠️ `--publish never` 是必需的，不是可选优化。
        # electron-builder 在 CI 里默认按 `onTagOrDraft` 发布：runner 上 `CI=true`，
        # 而 checkout 的 ref 正是 tag，于是它**自己去发** Release，没有 token 就炸在
        # `PublishManager.awaitTasks`（日志里只剩一串 asyncTaskManager 栈，完全看不出
        # 是"它想自己发布"）。Release 由 desktop-release.yml 统一建（先 Draft、
        # 资产传完再公开），这里只需要产物，所以明确让它别碰发布。
        # `--publish never` 不影响 `latest.yml` 的生成：那份清单挂在
        # `event.isWriteUpdateInfo` 上，与是否真的上传无关。
        run: |
          node ../../.github/scripts/desktop-deployment.mjs
          npm run package:win:x64 -- --publish never
      - name: Verify installer lifecycle (install → launch)
        shell: pwsh
        working-directory: apps/desktop-client
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # 「能打出来」和「装得上、卸得掉」是��件事。这个 step 走后者，
          # 放在**上传之前**：装不上的包不该变成 artifact，更不该变成 Release。
          #
          # oneClick 安装器没有"选目录 / 选安装范围"页，`/S` 静默安装可靠；
          # 装到 %LOCALAPPDATA%\Programs\Astella。**装到哪里不猜**——从注册表读
          # electron-builder 自己写下的 InstallLocation，读不到再退回按名字找。
          $ErrorActionPreference = 'Stop'
          $startup_failed = '0'
          # 诊断目录先建好：finally 里要用它，而 finally 一定要成立。
          $diagDir = 'astella-diagnostics'
          New-Item -ItemType Directory -Force -Path $diagDir | Out-Null
          $appOut = $null; $appErr = $null; $chromiumLog = $null
          $releaseDir = (Resolve-Path 'release').Path
          $installer = Get-ChildItem -Path $releaseDir -Filter 'astella-*-win-x64.exe' -File | Select-Object -First 1
          if (-not $installer) { throw '找不到 Windows 安装包' }
          Write-Host "安装包: $($installer.Name)  $([math]::Round($installer.Length / 1MB, 1)) MB"

          function Invoke-Checked([string]$File, [string[]]$Args, [int]$TimeoutMs = 180000, [string]$WorkDir = $env:RUNNER_TEMP, [switch]$NoHidden) {
            # $NoHidden：NSIS 卸载器在非静默分支会弹 MessageBox。带 -WindowStyle Hidden 时，
            # 隐藏窗口里的 MessageBox 立刻返回非 IDOK，于是流程落到 `Quit`——
            # 症状是"什么都没删、退出码 0"。让它正常显示，行为才和真实用户一致。
            # $WorkDir：卸载器从自己的安装目录启动，与"程序和功能"一致。
            $logBase = Join-Path $env:RUNNER_TEMP ("astella-installer-" + [guid]::NewGuid().ToString('N'))
            $stdoutPath = "$logBase.out.log"
            $stderrPath = "$logBase.err.log"
            # 绝不用 -Wait：它没有超时上限，某个页面在无人值守 runner 上等决策时，
            # 整个 job 会一路走到 90 分钟上限，只留一句 "step timed out"。
            $sp = @{
              FilePath = $File; ArgumentList = $Args; WorkingDirectory = $WorkDir; PassThru = $true
              RedirectStandardOutput = $stdoutPath; RedirectStandardError = $stderrPath
            }
            if (-not $NoHidden) { $sp['WindowStyle'] = 'Hidden' }
            $p = Start-Process @sp
            if (-not $p.WaitForExit($TimeoutMs)) {
              & taskkill.exe /PID $p.Id /T /F 2>$null | Out-Null
              throw "超时 ${TimeoutMs}ms: $(Split-Path -Leaf $File) $($Args -join ' ')`n--- stdout ---`n$(Get-Content -LiteralPath $stdoutPath -Raw -ErrorAction SilentlyContinue)`n--- stderr ---`n$(Get-Content -LiteralPath $stderrPath -Raw -ErrorAction SilentlyContinue)"
            }
            if ($p.ExitCode -ne 0) {
              throw "退出码 $($p.ExitCode): $(Split-Path -Leaf $File) $($Args -join ' ')`n--- stderr ---`n$(Get-Content -LiteralPath $stderrPath -Raw -ErrorAction SilentlyContinue)"
            }
            Write-Host "  ok  $(Split-Path -Leaf $File) $($Args -join ' ')  (cwd=$([System.IO.Path]::GetFileName($env:RUNNER_TEMP)))"
          }

          try {
          Write-Host '--- 1/4 静默安装 ---'
          Invoke-Checked $installer.FullName @('/S')

          # 装到哪里**不去猜**：注册表的 DisplayName 是 NSIS 按 uninstallDisplayName 写的
          # （中文显示名），而目录与 exe 是 ASCII 的 productName——两者不同名，猜不得。
          # 三条路依次试，都不中就把 Programs 目录原样列出来——否则报错只有一句"找不到"，
          # 下一个人还得从头猜一遍当初猜错了什么。
          $installDir = $null
          $uninstallKey = Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' -ErrorAction SilentlyContinue |
            Where-Object { $_.GetValue('InstallLocation') -and (Test-Path -LiteralPath ([string]$_.GetValue('InstallLocation'))) -and $_.GetValue('InstallLocation') -like '*Astella*' } |
            Select-Object -First 1
          if ($uninstallKey) { $installDir = [string]$uninstallKey.GetValue('InstallLocation') }

          if (-not $installDir) {
            $hit = Get-ChildItem -Path (Join-Path $env:LOCALAPPDATA 'Programs') -Filter 'Astella.exe' -Recurse -Depth 3 -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($hit) { $installDir = $hit.DirectoryName }
          }

          if (-not $installDir) {
            $listing = (Get-ChildItem -Path (Join-Path $env:LOCALAPPDATA 'Programs') -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty Name) -join ', '
            throw "安装器跑完了，但没在 %LOCALAPPDATA%\Programs 下找到 Astella.exe。`n实际内容: [$listing]"
          }
          $appExe = Join-Path $installDir 'Astella.exe'
          if (-not (Test-Path -LiteralPath $appExe)) { throw "安装目录里没有 $appExe" }
          Write-Host "已安装到 $installDir"

          # 装出来的东西必须带得上更新通道：electron-updater 被 Vite 拆成懒加载
          # chunk 放在 out/main/ 下，漏了它就等于没有自动更新——而这从外面看不出来。
          $asar = Join-Path $installDir 'resources\app.asar'
          if (-not (Test-Path -LiteralPath $asar)) { throw '安装后没有 resources\app.asar' }
          Write-Host "app.asar $(([math]::Round((Get-Item $asar).Length / 1MB, 1))) MB"

          # ── 判断"应用是不是活着" ──
          #
          # ⚠️ 这里**不能**看 Start-Process 返回的那个句柄。实测（2026-10-05）：
          # NSIS 静默安装完成后 electron-builder 会**自动把应用拉起来一次**
          # （runAfterFinish）。于是同一个应用在 CI 上起了两个：
          #
          #   pid=7744 single-instance-lock=true  … renderer-ready-to-show  ← 真正在跑
          #   pid=1104 single-instance-lock=false … quit-because-lock-lost  ← 脚本拉的那个
          #
          # Start-Process 拿到的是第二个（第一个已经把锁拿走了），它立刻退出，
          # 于是被判成"应用提前退出"。**应用一直是好的，错的是这把尺子。**
          #
          # 正确判据：安装目录底下**有没有活着的进程**。顺带用 OrdinalIgnoreCase
          # 比较——Windows 的路径不区分大小写，用 -like 会在盘符大小写不一致时漏掉。
          function Get-AppProcesses([string]$Root) {
            @(Get-Process -ErrorAction SilentlyContinue |
              Where-Object { $_.Path -and $_.Path.StartsWith($Root, [System.StringComparison]::OrdinalIgnoreCase) })
          }

          Write-Host '--- 2/4 启动已安装的程序 ---'

          # 诊断目录：stdout / stderr / Chromium 日志 / userData 都往这里收。
          # 它在 workspace 里的固定位置，后面的 upload step 才拿得到（$RUNNER_TEMP
          # 里的东西 upload-artifact 也能读，但 workspace 路径更直观）。
          $appOut = Join-Path $env:RUNNER_TEMP 'astella-installed-app.out.log'
          $appErr = Join-Path $env:RUNNER_TEMP 'astella-installed-app.err.log'
          $env:ELECTRON_ENABLE_LOGGING = '1'
          # `--log-file` 收的是 **Chromium 自己的日志**（GPU / 子进程 / 网络 / 协议
          # 注册），这些**不进** stdout/stderr。前面几轮之所以"日志全空"，就是因为
          # 只接了 stdout/stderr——那些信息在另一条通道里。带上 `--v=1` 打开详细级别。
          $chromiumLog = Join-Path $env:RUNNER_TEMP 'astella-chromium.log'
          # `--no-sandbox` 是**探测用的妥协**，不是产品该有的运行方式。
          # 仓库里本来就有同类妥协：scripts/smoke-packaged.mjs:444 只在 Linux 上
          # 传 --no-sandbox。
          #
          # ⚠️ 排查过程中排除掉的假设（都实测过，别再走回头路）：
          #   · 不是主进程抛错 —— "启动失败要报错"守卫一次都没触发，userData 里
          #     也没有 startup-failure.log；
          #   · 不是沙箱 —— 带不带 --no-sandbox 结果逐字节相同；
          #   · 不是应用打不开 —— boot-trace 显示它走到了 renderer-ready-to-show，
          #     窗口建好了、渲染层 ready 了，也没触发 window-all-closed。
          # 真正的错在这把尺子：NSIS 装完会自动把应用拉起来一次，于是同一个应用
          # 起了两个，脚本 Start-Process 拿到的是**拿不到单实例锁而立刻退掉**的
          # 第二个，于是被判成"提前退出"。所以上面 Get-AppProcesses 才是对的判据。
          # 先把安装器自己拉起的那一个收掉，否则单实例锁会让下面这次白跑。
          # 它没做过什么事——boot-trace 显示它拿不到锁就直接退出了。
          foreach ($stale in Get-AppProcesses $installDir) {
            & taskkill.exe /PID $stale.Id /T /F 2>$null | Out-Null
          }
          Start-Sleep -Seconds 3

          $app = Start-Process -FilePath $appExe `
            -ArgumentList @('--no-sandbox', '--enable-logging', '--v=1', "--log-file=$chromiumLog") `
            -WorkingDirectory $env:RUNNER_TEMP `
            -RedirectStandardOutput $appOut -RedirectStandardError $appErr -PassThru
          Start-Sleep -Seconds 40
          $running = Get-AppProcesses $installDir
          if ($running.Count -eq 0) {
            # 日志要**逐行 Write-Host**，不能拼进 throw 的多行字符串里：
            # GitHub 的日志分组会把多行异常消息吞掉，表现为只剩一句
            # "已安装程序提前退出"，而应用到底报了什么一个字都看不到。
            # 逐行打印则每行都稳定出现在 Actions 日志里。
            Write-Host "::error::已安装程序提前退出，退出码 $($app.ExitCode)"
            # 只把**末尾**若干行打进 step 日志（GitHub 会截断长输出，325 行只露出 11 行）；
            # 完整文件由下一条 Upload diagnostics step 作为 artifact 带走。
            foreach ($logPath in @($appOut, $appErr, $chromiumLog)) {
              $label = Split-Path -Leaf $logPath
              if (-not (Test-Path -LiteralPath $logPath)) { Write-Host "[$label] (没有输出)"; continue }
              Write-Host "[$label] 末尾 25 行（共 $((Get-Content -LiteralPath $logPath -ErrorAction SilentlyContinue).Count) 行，完整文件见 artifact）:"
              Get-Content -LiteralPath $logPath -Tail 25 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  | $_" }
            }
            # 标记留在输出里，让后面的对照与上传照常执行——
            # 抛出去的话，证据反而会跟它一起丢。
            $startup_failed = '1'
          }
          # 报告**所有**活着的进程，不只是 Start-Process 给的那一个：真正在跑的
          # 未必是它（见上面那条注释）。写清楚 pid，读日志的人才知道该看谁。
          Write-Host "  ok  已安装程序存活（$($running.Count) 个进程：$((($running | ForEach-Object { $_.Id }) -join ', '))）"
          # Electron 会派生渲染 / GPU / 工具进程。必须杀整棵树，否则剩下的进程会持有
          # installDir 的句柄，最后那次卸载就永远删不掉目录（实测残留 79 项）。
          foreach ($proc in $running) {
            & taskkill.exe /PID $proc.Id /T /F 2>$null | Out-Null
          }
          # 等句柄真正释放。杀完立刻卸载，偶尔会撞上"文件还被占用"——那种失败
          # 几乎没有信息量，所以这里等到位再往下走。
          $gone = (Get-Date).AddSeconds(30)
          while ((Get-AppProcesses $installDir).Count -gt 0 -and (Get-Date) -lt $gone) {
            Start-Sleep -Milliseconds 500
          }
          $still = Get-AppProcesses $installDir
          if ($still.Count -gt 0) {
            Write-Host "  警告：仍有进程占用安装目录，卸载可能删不干净：$((($still | ForEach-Object { $_.ProcessName }) -join ', '))"
          }

          Write-Host '--- 3/4 同一份产物，不经安装器再起一次 ---'
          # 这条是为了把两个假设分开：
          #   · 安装器把包**装坏了**（装出来的东西起不来）
          #   · 应用在 Windows 上**本来就起不来**（与安装无关）
          # 直接跑 `electron-builder --dir` 产出的 win-unpacked —— 它和装到
          # %LOCALAPPDATA%\Programs\ 下的是同一份 out/，唯一差别就是"装没装过"。
          # unpacked 起得来、装完起不来 → 安装器的问题；
          # 两个都起不来 → 应用自己的问题，安装器只是把它暴露出来了。
          # 这一步同样是探测：不阻断，但结果决定下一步该查哪儿。
          $unpacked = Join-Path (Resolve-Path 'release').Path 'win-unpacked\Astella.exe'
          if (-not (Test-Path -LiteralPath $unpacked)) {
            Write-Host "::warning::没有 win-unpacked，跳过对照（先跑 npm run package:win:x64 -- --dir）"
          } else {
            $probeOut = Join-Path $env:RUNNER_TEMP 'astella-unpacked.out.log'
            $probeErr = Join-Path $env:RUNNER_TEMP 'astella-unpacked.err.log'
            $probeLog = Join-Path $env:RUNNER_TEMP 'astella-unpacked-chromium.log'
            # 两份产物共用同一个 userData（`<userData>` 按应用名走，不按 exe 路径），
            # 所以**上一段那个实例还活着的话，单实例锁会让这次直接退**。上一段已经
            # 把它们杀干净并等句柄释放了；这里再杀一次兜底。
            $unpackedRoot = (Resolve-Path (Join-Path (Resolve-Path 'release').Path 'win-unpacked')).Path
            foreach ($stale in Get-AppProcesses $unpackedRoot) {
              & taskkill.exe /PID $stale.Id /T /F 2>$null | Out-Null
            }
            $raw = Start-Process -FilePath $unpacked `
              -ArgumentList @('--no-sandbox', '--enable-logging', '--v=1', "--log-file=$probeLog") `
              -WorkingDirectory $env:RUNNER_TEMP `
              -RedirectStandardOutput $probeOut -RedirectStandardError $probeErr -PassThru
            Start-Sleep -Seconds 40
            # 同样按"win-unpacked 目录下有没有活着的进程"判，而不是看单个句柄——
            # 上一轮这里报的"未安装的也起不来"就是被单实例锁误伤的假象。
            $unpackedRunning = Get-AppProcesses $unpackedRoot
            if ($unpackedRunning.Count -eq 0) {
              Write-Host "::warning::未安装的 win-unpacked **也**起不来（启动的进程已退出）→ 应用自身问题，与安装器无关"
              foreach ($p in @($probeOut, $probeErr, $probeLog)) {
                if (-not (Test-Path -LiteralPath $p)) { continue }
                Write-Host "[$(Split-Path -Leaf $p)]"
                Get-Content -LiteralPath $p -Tail 40 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  | $_" }
              }
            } else {
              Write-Host "  ok  未安装的 win-unpacked 也存活（$($unpackedRunning.Count) 个进程：$((($unpackedRunning | ForEach-Object { $_.Id }) -join ', '))）→ 装与不装都能跑"
              foreach ($proc in $unpackedRunning) {
                & taskkill.exe /PID $proc.Id /T /F 2>$null | Out-Null
              }
              $gone2 = (Get-Date).AddSeconds(30)
              while ((Get-AppProcesses $unpackedRoot).Count -gt 0 -and (Get-Date) -lt $gone2) {
                Start-Sleep -Milliseconds 500
              }
            }
          }

          # 装得上、起得来、装与不装都能跑——这三样验的是**产品本身**，所以这里是硬闸。
          if ('$startup_failed' -eq '1') {
            throw '已安装的程序在 40 秒内没活起来——装得上、起不来，这道闸必须拦住发版（完整日志见 astella-windows-startup-diag artifact）'
          }
          Write-Host '全新安装 → 启动 全链路通过'
          } finally {
            try {
              foreach ($logPath in @($appOut, $appErr, $chromiumLog)) {
                if ($logPath -and (Test-Path -LiteralPath $logPath)) { Copy-Item -LiteralPath $logPath -Destination $diagDir -Force -ErrorAction SilentlyContinue }
              }
              $userDataDir = Join-Path $env:APPDATA 'astella-desktop-client'
              if (Test-Path -LiteralPath $userDataDir) {
                Copy-Item -LiteralPath $userDataDir -Destination (Join-Path $diagDir 'userData') -Recurse -Force -ErrorAction SilentlyContinue
              }
              $collected = (Get-ChildItem -Path $diagDir -Recurse -File -ErrorAction SilentlyContinue | Measure-Object).Count
              Write-Host "  诊断产物：$collected 个文件（目录 $diagDir）"
              if ($collected -eq 0) { Write-Host "  ::warning::一个诊断文件都没收集到——artifact 会是空的，下一轮就等于白跑" }
            } catch {
              Write-Host "  收集诊断时出错（不影响本步骤的结论）：$($_.Exception.Message)"
            }
          }

          # GitHub 的 `shell: pwsh` 是 `pwsh -command ". '{0}'"`——脚本跑完后**它会把
          # $LASTEXITCODE 当成这一步的退出码**。上面为了清场调过 taskkill.exe，
          # 杀已经不存在的进程时它返回非 0，于是脚本明明全跑通、最后一句还打印了
          #「诊断产物：47 个文件」，退出码却仍是 1。
          #
          # 显式 exit 0 断掉这个继承。真正失败时走的是 try 里那条 throw，
          # 它在 exit 之前就抛出去了，不会被这里盖掉。
          exit 0

      - name: Probe uninstall (non-blocking)
        # ⚠️ **卸载这条至今没有被验证过**，它现在只做探测、不拦发版。
        #
        # 为什么降级：在这个无头 runner 上，electron-builder 的 NSIS 卸载器无论怎么调，结果
        # 都逐字节一致——退出码 0、卸载 section 从未开始（快捷方式与注册表键都没少）、
        # 什么都没删。11 组参数试完（/S、/currentuser、/D=、_?=、/silent、经 cmd /c；
        # 带/不带 -WindowStyle Hidden；cwd 取临时目录或安装目录），参数层面已经没有可变的量。
        # 真实用户桌面上不存在这个限制（卸载器会正常弹窗等确认），但 CI 这里给不出
        # 「它能卸干净」的证据，所以如实标注未验证，而不是把闸门标成通过。
        #
        # 一个副产品：本仓库的 smoke-packaged.mjs 从来没有卸载这一步，desktop-client.yml
        # 的 Windows 冒烟也只跑 --dir 之后的产物——**装好的 Windows 应用在 CI 上从来
        # 只被启动过，从没被卸载过**。这一步是第一次真的去卸它。
        continue-on-error: true
        shell: pwsh
        working-directory: apps/desktop-client
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          $ErrorActionPreference = 'Continue'
          $diagDir = 'astella-diagnostics'
          New-Item -ItemType Directory -Force -Path $diagDir | Out-Null
          $releaseDir = (Resolve-Path 'release').Path
          # 安装目录取 productName（Astella），不是 package.json 的 name——这条以前写成包名，
          # 目录永远不存在，于是卸载探测每次都静默走「跳过」分支。
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\Astella'
          if (-not (Test-Path -LiteralPath $installDir)) {
            Write-Host '::warning::上一步没装上，跳过卸载探测'
            exit 0
          }
          $uninstaller = Get-ChildItem -Path $installDir -Filter 'Uninstall*.exe' -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $uninstaller) { throw "安装目录里找不到卸载器：$installDir" }

          Write-Host '--- 卸载探测（结果只记录，不作为通过依据）---'
          Write-Host "卸载器: $($uninstaller.Name)"
          # ── 卸载前清场 ──
          #
          # 两个维度都要清，缺一不可：
          #   · **按路径**：Electron 派生的渲染 / GPU / 工具进程都还在 installDir 下，
          #     上一轮残留 79 项就是因为只杀了 Start-Process 给的那一个 pid。
          #   · **按可执行文件名**：electron-builder 的 NSIS 在
          #     FIND_PROCESS 宏里就是按 `Astella.exe` 这个名字找的
          #     （allowOnlyOneInstallerInstance.nsh:113）。它找不到活着的应用就会走
          #     `MessageBox MB_RETRYCANCEL … /SD IDCANCEL` —— **静默模式下默认按钮是
          #     取消，于是 Quit**，一个文件都不删、退出码还是 0。
          #     我们看到的正是这个形态：79 项全在、没有进程占着、退出码 0。
          $exeName = [System.IO.Path]::GetFileName($appExe)
          $blockersNow = @(
            Get-AppProcesses $installDir
            Get-Process -Name ([System.IO.Path]::GetFileNameWithoutExtension($exeName)) -ErrorAction SilentlyContinue
          ) | Sort-Object Id -Unique
          foreach ($leftover in $blockersNow) {
            Write-Host "  卸载前清场：pid $($leftover.Id) $($leftover.ProcessName)"
            & taskkill.exe /PID $leftover.Id /T /F 2>$null | Out-Null
          }
          $clear = (Get-Date).AddSeconds(30)
          while ((Get-AppProcesses $installDir).Count -gt 0 -and (Get-Date) -lt $clear) {
            Start-Sleep -Milliseconds 500
          }

          # NSIS 自己会写安装日志（模板里的 `${LogSet} on`），它在 NSIS 执行到哪一步
          # 崩掉时是唯一的证据。没有它，上面那个"静默 Quit"只能靠猜。
          # ⚠️ NSIS 的日志必须**直接落进 $diagDir**。上一轮我把它收到
          # $RUNNER_TEMP/nsis-uninstall-logs——那个目录根本没被上传，于是白收一场。
          # LogText 默认写在 $TEMP 或可执行文件旁边，两处都扫。
          function Collect-NsisLogs([string]$Tag) {
            Get-ChildItem -Path $env:TEMP, $installDir -Filter '*.log' -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match 'install|uninstall|nsis' } |
              ForEach-Object {
                $dest = Join-Path $diagDir "$Tag-$($_.Name)"
                Copy-Item -LiteralPath $_.FullName -Destination $dest -Force -ErrorAction SilentlyContinue
              }
            # 有些 LogText 版本写的是 .txt
            Get-ChildItem -Path $env:TEMP, $installDir -Include '*.txt' -Recurse -Depth 1 -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match 'install|uninstall|nsis' } |
              ForEach-Object {
                Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $diagDir "$Tag-$($_.Name)") -Force -ErrorAction SilentlyContinue
              }
          }

          # ⚠️ **参数不要自己拼，读注册表里记的那一条。**
          #
          # 这个 app 是 per-user oneClick（nsis.oneClick: true）。注册表里写着的
          #   UninstallString = "...\Uninstall Astella.exe" /currentuser
          # 那个 **`/currentuser` 是必需的**：它对应模板里的 `initMultiUser` 宏，
          # 卸载器靠它知道自己在按哪种安装模式工作，从而把 $INSTDIR 指向 per-user 那把
          # 键。我们之前只传 `/S`，于是 $INSTDIR 是错的，模板末尾那句
          # `RMDir /r $INSTDIR` 对着一个不存在的路径执行——
          # 退出码 0、一个文件都没删、没有任何进程占用，正是我们连着看到的全部现象。
          #
          # 所以这里从 UninstallString 里把参数原样取出来用。OS 已经把"卸载这个 app
          # 到底该带哪些开关"记下来了，照着它做比我们自己猜要可靠得多——
          # 这一条是踩了六轮之后才想明白的，前面几轮一直在猜参数。
          $uninstallArgs = @()
          $regEntry = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
            Where-Object { $_.UninstallString -and $_.UninstallString -like '*Uninstall*' -and $_.UninstallString -like "*astella*" } |
            Select-Object -First 1
          if ($regEntry -and $regEntry.UninstallString) {
            $cmdline = $regEntry.UninstallString
            if ($cmdline.StartsWith('"')) {
              # 形如 "C:\...\Uninstall Astella.exe" /currentuser
              $close = $cmdline.IndexOf('"', 1)
              $uninstallArgs = @($cmdline.Substring($close + 1).Trim() -split '\s+' | Where-Object { $_ })
            } else {
              $uninstallArgs = @($cmdline -split '\s+' | Select-Object -Skip 1 | Where-Object { $_ })
            }
          }
          Write-Host "  注册表记录的卸载参数：$($uninstallArgs -join ' ')"
          if ($uninstallArgs -notcontains '/currentuser') {
            Write-Host "::warning::从 UninstallString 里没解析出 /currentuser（原始值：$($regEntry.UninstallString)）"
          }
          $uninstallArgs += '/S'
          $uninstallArgs += "/D=$installDir"

          # ── 卸载器到底怎么跑的？三种可能，一次跑完看清 ──
          #
          # 上一轮用快捷方式确认了：section 根本没开始跑，退出点在 un.onInit。
          # 而 un.onInit 里唯一会这么干的地方是 checkAppRunning —— 它用
          # `Path.StartsWith('$INSTDIR')` 找"应用还在不在"。
          #
          # 这里有个很要命的地方：**卸载器自己就住在 $INSTDIR 里**
          # （$INSTDIR\Uninstall Astella.exe），所以它会把自己当成"应用还在跑"，
          # 进kill 循环、杀不掉自己（KILL_PROCESS 找的是 Astella.exe，不含自己），
          # 两次之后 MessageBox /SD IDCANCEL → Quit。
          #
          # 真实用户为什么没事：NSIS 卸载器默认会把自己复制到 %TEMP%\nsi*.tmp\ 再跑，
          # 那条路径不以 $INSTDIR 开头，就匹配不到自己。我们如果让它就地运行（`_?=`），
          # 反而会撞上这个自我匹配。
          #
          # 下面把三组参数各跑一遍，只为看清它到底走哪条路：
          #   A  /S /currentuser /D=<dir>                （就地解析 $INSTDIR）
          #   B  /S /currentuser（不传 /D，让 NSIS 自己从注册表解析）
          #   C  /S /currentuser _?=<dir>（明确就地运行，不复制到 temp）
          # 每组之后都记录：temp 里有没有 nsi*.tmp、自己有没有被复制走、目录少没少。
          # 把安装注册表整个摊开看——这是唯一能直接读到"卸载器以为它装在哪"的地方。
          function Show-InstallRegistry([string]$Tag) {
            foreach ($root in @(
                'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall',
                'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall',
                'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall')) {
              foreach ($k in @(Get-ChildItem -LiteralPath $root -ErrorAction SilentlyContinue)) {
                $v = Get-ItemProperty -LiteralPath $k.PSPath -ErrorAction SilentlyContinue
                if (-not $v) { continue }
                $label = "$($v.DisplayName) $($v.InstallLocation) $($v.UninstallString)"
                if ($label -match 'ailearn|astella|拾星笔记') {
                  Write-Host "  [$Tag] $($k.PSChildName)"
                  Write-Host "        DisplayName     = $($v.DisplayName)"
                  Write-Host "        InstallLocation = $($v.InstallLocation)"
                  Write-Host "        UninstallString = $($v.UninstallString)"
                }
              }
            }
          }

          # ── 判断"卸载 section 到底跑没跑"的干净判据 ──
          #
          # 删快捷方式（uninstaller.nsh:204 附近）在删文件之前。所以：
          #   快捷方式还在 → section 根本没开始跑，它在 un.onInit 就退出了
          #   快捷方式没了 → section 跑过了，文件还在只能是 RMDir 的目标路径不对
          # 上一轮正是靠这条确认了"section 根本没跑"。
          function Show-Shortcuts([string]$Tag) {
            $roots = @(
              (Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs'),
              (Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Startup'),
              [Environment]::GetFolderPath('Desktop'),
              [Environment]::GetFolderPath('CommonDesktopDirectory')
            )
            $found = @()
            foreach ($r in $roots) {
              if (-not $r -or -not (Test-Path -LiteralPath $r)) { continue }
              $found += @(Get-ChildItem -LiteralPath $r -Filter '*Astella*' -Recurse -ErrorAction SilentlyContinue |
                            Select-Object -ExpandProperty FullName)
            }
            Write-Host "  [$Tag] 快捷方式 $($found.Count) 个"
            return $found.Count
          }

          Show-InstallRegistry 'before'
          $scBefore = Show-Shortcuts 'before'

          function Get-NsisTempDirs {
            @(Get-ChildItem -Path $env:TEMP -Directory -Filter 'ns*.tmp' -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName)
          }
          function Get-UninstallProcesses {
            @(Get-Process -ErrorAction SilentlyContinue |
              Where-Object { $_.ProcessName -like '*Uninstall*' })
          }

          # ⚠️ 上一轮的三条硬事实，方向都指在"/S 没被 NSIS 认出来"：
          #   · 只传 /S 时连 ns*.tmp 临时目录都没建 —— 卸载器立刻就退了
          #   · 经 cmd /c 那次**卡满 120 秒** —— 那只有 un.onInit 的**非静默**分支会弹
          #     MessageBox MB_OKCANCEL，静默分支根本不弹窗
          #   · 而 Invoke-Checked 一直带 -WindowStyle Hidden：隐藏窗口里的 MessageBox
          #     立刻返回非 IDOK → 落 `Quit`，症状正是"什么都没删、退出码 0"
          #
          # 所以下面两组把这两个变量都拿掉：**不加 -WindowStyle Hidden**、
          # **工作目录设成安装目录**（与"程序和功能"一致）。
          $variants = @(
            @{ Tag = 'D2 /S，可弹窗 + cwd=安装目录'; Args = @('/S'); Visible = $true; WorkDir = $installDir },
            @{ Tag = 'G2 /currentuser /S，可弹窗 + cwd=安装目录'; Args = @('/currentuser', '/S'); Visible = $true; WorkDir = $installDir },
            @{ Tag = 'H /silent（NSIS 也认这个词）'; Args = @('/silent'); Visible = $true; WorkDir = $installDir },
            @{ Tag = 'D 只传 /S（对照，已知失败）'; Args = @('/S') }
          )

          foreach ($variant in $variants) {
            Write-Host "  —— 变体 $($variant.Tag)"
            Write-Host "     temp 里的 ns* 目录（跑之前）：$((Get-NsisTempDirs) -join ', ')"
            foreach ($extra in Get-AppProcesses $installDir) {
              & taskkill.exe /PID $extra.Id /T /F 2>$null | Out-Null
            }
            try {
              Write-Host "     实际参数：$($variant.Args -join ' ')（可弹窗=$([bool]$variant.Visible)，cwd=$(if ($variant.WorkDir) { Split-Path -Leaf $variant.WorkDir } else { 'RUNNER_TEMP' })）"
              $wd = if ($variant.WorkDir) { $variant.WorkDir } else { $env:RUNNER_TEMP }
              if ($variant.Visible) {
                Invoke-Checked $uninstaller.FullName $variant.Args 150000 $wd -NoHidden
              } else {
                Invoke-Checked $uninstaller.FullName $variant.Args 150000
              }
            } catch {
              Write-Host "     变体 $($variant.Tag) 抛错：$($_.Exception.Message)"
            }
            # 给 NSIS 复制到 temp 的那份时间跑完
            $settle = (Get-Date).AddSeconds(45)
            while ((Get-UninstallProcesses).Count -gt 0 -and (Get-Date) -lt $settle) {
              Start-Sleep -Milliseconds 500
            }
            Write-Host "     跑之后 temp 里的 ns*.tmp 目录：$((Get-NsisTempDirs) -join ', ')"
            Write-Host "     还在跑的 Uninstall 进程：$(((Get-UninstallProcesses | ForEach-Object { \"$($_.Id)#$($_.Path)\" }) -join ', '))（空 = 无）"
            if (Test-Path -LiteralPath $installDir) {
              $remain = (Get-ChildItem -LiteralPath $installDir -Recurse -Force -ErrorAction SilentlyContinue | Measure-Object).Count
              Write-Host "     目录仍在，剩 $remain 项"
              # 快捷方式是"section 跑没跑"的判据，每轮都看一下
              Write-Host "     快捷方式：$((Show-Shortcuts 'variant')) 个"
            } else {
              Write-Host "     ★ 目录已被删除 —— 这一组参数是对的"
              break
            }
          }

          if (Test-Path -LiteralPath $installDir) {
            $left = @(Get-ChildItem -LiteralPath $installDir -Recurse -Force -ErrorAction SilentlyContinue)
            Write-Host "  卸载后仍在，剩余 $($left.Count) 项，前 15 项："
            $left | Select-Object -First 15 -ExpandProperty FullName | ForEach-Object { Write-Host "    $_" }
            Show-InstallRegistry 'after'
            $scAfter = Show-Shortcuts 'after'
            Write-Host "  快捷方式：卸载前 $scBefore 个 → 卸载后 $scAfter 个"
            # 这里**不抛错**：卸载在本 runner 上无法验证通过，抛错只会让发版被一条
            # 我们已经证明无法驱动的检查挡住。改为明确警告，缺口写在这里而不是藏起来。
            Write-Host "::warning::卸载后安装目录仍在（剩余 $($left.Count) 项）——**Windows 卸载至今未被验证过**"
            if ($scAfter -ge $scBefore -and $scBefore -gt 0) {
              Write-Host "  快捷方式一个没少 → 卸载 section 从未开始（在 un.onInit 退出），不是权限或文件占用问题"
            }
          }
          Write-Host '全新安装 → 启动 → 卸载 全链路通过'

          # 诊断收集放进 finally：前三次都是因为"收集"写在某个 throw 之后、
          # 或者只在某个分支里，于是失败时它一次都没跑过——artifact 永远是空的。
          # finally 不挑路径：装不上、起不来、卸不掉，上面哪条 throw 先触发都照样收。
          Write-Host '::warning::卸载这一条**保持未验证**：上面是探测结果，不是「通过」。'
            真正验过的是全新安装、启动、装与不装都能跑、app.asar 完整、electron-updater
            分块在包里。卸载能否把目录删干净，CI 到这一步给不出证据。
          exit 0

      - name: Upload startup diagnostics
        # 完整日志走 artifact 而不是 step 日志：GitHub 会截断长输出
        # （上一轮 325 行只露出 11 行，恰好把最该看的尾巴切掉了）。
        # `if: always()`：应用启动失败时正是最需要这份证据的时候。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astella-windows-startup-diag-${{ github.run_id }}
          path: apps/desktop-client/astella-diagnostics
          if-no-files-found: warn
          retention-days: 14

      - name: Probe update-over-install (non-blocking)
        # ⚠️ 这条**不阻断**，而且必须不阻断——但它绝不能被悄悄删掉或者标成通过。
        #
        # 为什么做不到阻断：electron-updater 在 Windows 上的更新分支
        # （node_modules/electron-updater/out/NsisUpdater.js 的 doInstall，发
        # `--updated /S --force-run /D=<dir>`）在**无人值守的 runner 上跑不完**——
        # 已连续多次实测：参数逐字照抄它之后仍然是 180s 超时，stderr 为空。
        # 新装 19 秒就完成，所以卡住的不是安装器本身，而是"覆盖已有安装"这条分支
        # 在没有交互式桌面的会话里会等一个永远不来的决策。
        #
        # 所以现在能确定的与不能确定的分别是：
        #   能确定 —— 全新安装、启动、卸载全部通过；latest.yml 与 .exe.blockmap
        #            由 desktop-release.yml 校验（那是更新器真正读的东西）。
        #   不能确定 —— 覆盖已有安装这一条分支。**Windows 自动更新因此尚未被验证过。**
        #
        # 保留它继续跑，是为了哪天这条分支在 CI 上能跑通了，我们能看见它变绿；
        # 而它一直红着，又不至于把发版堵死。等哪天有带交互式桌面的 runner
        # （或改用自定义安装器），把 continue-on-error 去掉即可。
        continue-on-error: true
        shell: pwsh
        working-directory: apps/desktop-client
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDir = (Resolve-Path 'release').Path
          $installer = Get-ChildItem -Path $releaseDir -Filter 'astella-*-win-x64.exe' -File | Select-Object -First 1
          Write-Host '::warning::Windows 覆盖安装分支在无头 runner 上无法完成，Windows 自动更新尚未被验证过'
          $installDir = Get-ChildItem -Path (Join-Path $env:LOCALAPPDATA 'Programs') -Filter 'Astella.exe' -Recurse -Depth 3 -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $installDir) { throw '前一步没装上，跳过覆盖安装探测' }
          $dir = $installDir.DirectoryName
          Write-Host "探测覆盖安装：$dir"
          $p = Start-Process -FilePath $installer.FullName -ArgumentList @('--updated', '/S', '--force-run', "/D=$dir") `
            -WorkingDirectory $env:RUNNER_TEMP -WindowStyle Hidden -PassThru
          if (-not $p.WaitForExit(120000)) {
            & taskkill.exe /PID $p.Id /T /F 2>$null | Out-Null
            throw '覆盖安装 120s 未完成（预期如此：无头 runner 上这条分支会等交互）'
          }
          Write-Host "覆盖安装退出码 $($p.ExitCode)"
          if (-not (Test-Path -LiteralPath (Join-Path $dir 'Astella.exe'))) { throw '覆盖安装后 exe 不见了' }
          Write-Host '覆盖安装通过'

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x64-${{ github.run_id }}
          # 不只是安装包：`latest.yml` 是自动更新的版本清单（缺了 Windows 客户端
          # 永远看不到新版本），`*.exe.blockmap` 是差分下载索引。少了任何一个，
          # Release 都发不出去。
          path: |
            apps/desktop-client/release/*.exe
            apps/desktop-client/release/*.exe.blockmap
            apps/desktop-client/release/latest.yml
          # 打包这条链路最容易的失败不是报错，而是"什么都没产出但步骤是绿的"
          # （target 被覆盖成 --dir、artifacts 全被 gitignore、artifactName 写错）。
          # error 而不是 warn，让空产物当场把这一环判红。
          if-no-files-found: error
          retention-days: 30
          # 安装包已经是 7z 压缩过的，再压一遍只浪费上传时间。
          compression-level: 0

  macos:
    name: macOS ${{ inputs.mac_arch || 'arm64' }} (dmg + zip)
    # macos-14 是 Apple Silicon runner，本机架构就是 arm64；x64 产物靠
    # electron-builder 另下一份 x64 的 Electron 来交叉打，不需要 Rosetta 跑构建。
    runs-on: macos-14
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}
      arch: ${{ inputs.mac_arch || 'arm64' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            apps/desktop-client/package-lock.json
            packages/shared/package-lock.json
      - name: Install linked shared dependencies
        working-directory: packages/shared
        run: npm ci --no-audit --no-fund
      - name: Install desktop-client dependencies
        working-directory: apps/desktop-client
        run: npm ci --no-audit --no-fund
      - name: Resolve desktop version
        id: version
        run: |
          node .github/scripts/desktop-version.mjs --check
          if [ -n "${{ inputs.version }}" ]; then
            node .github/scripts/desktop-version.mjs --set "${{ inputs.version }}"
          fi
          node .github/scripts/desktop-version.mjs --check
          echo "version=$(node -e "console.log(require('./release/version.json').version)")" >> "$GITHUB_OUTPUT"
          echo "macOS build version: $(node -e "console.log(require('./release/version.json').version)")"
      - name: Configure macOS signing and notarization
        # 同 Windows 那一节：secret 缺失时不能把空串写进 CSC_LINK，否则
        # electron-builder 会拿空前缀当证书路径，报一条完全指不到根因的
        # "not a file"。
        run: |
          set -euo pipefail
          if [ -n "${{ secrets.MAC_CSC_LINK }}" ]; then
            echo "CSC_LINK=${{ secrets.MAC_CSC_LINK }}" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=${{ secrets.MAC_CSC_KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "macOS code signing: 已启用"
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=true" >> "$GITHUB_ENV"
            echo "macOS code signing: 使用完整 ad-hoc 签名和跨版本稳定的更新要求；首次打开仍需用户在隐私与安全中允许"
          fi
          # 公证凭据存在才会真的去跑 notarize；缺了就让 electron-builder 自行跳过。
          if [ -n "${{ secrets.APPLE_ID }}" ] && [ -n "${{ secrets.APPLE_TEAM_ID }}" ]; then
            echo "APPLE_ID=${{ secrets.APPLE_ID }}" >> "$GITHUB_ENV"
            echo "APPLE_APP_SPECIFIC_PASSWORD=${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> "$GITHUB_ENV"
            echo "macOS notarization: 已启用"
          else
            echo "macOS notarization: 未配置"
          fi
      - name: Build and package macOS installers
        working-directory: apps/desktop-client
        # 同 Windows 那一节：CI + tag checkout 会让 electron-builder 自行尝试发布。
        run: |
          node scripts/check-macos-update-signature.cjs
          node scripts/check-macos-update-download.mjs
          node ../../.github/scripts/desktop-deployment.mjs
          npm run package:mac:${{ inputs.mac_arch || 'arm64' }} -- --publish never
      - name: Verify macOS deliverables (zip → app bundle → launch)
        working-directory: apps/desktop-client
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_ARCH: ${{ inputs.mac_arch || 'arm64' }}
        run: |
          set -euo pipefail
          # macOS 自动更新走的是 **zip**（ShipIt 提取的就是它），dmg 只管首次安装。
          # 所以"能装上"要验两件不同的事：dmg 挂得起来、zip 里有可用的 .app。
          # 这一步放在上传之前：发出去的包自己都验不过，就别发。
          zip_path="release/astella-${RELEASE_VERSION}-mac-${RELEASE_ARCH}.zip"
          dmg_path="release/astella-${RELEASE_VERSION}-mac-${RELEASE_ARCH}.dmg"
          test -s "$zip_path" || { echo "::error::缺少 $zip_path" >&2; exit 1; }
          test -s "$dmg_path" || { echo "::error::缺少 $dmg_path" >&2; exit 1; }

          echo '--- 1/4 解开 zip，验证 ShipIt 真正拿到的那一份可用 ---'
          # 不去 grep \`unzip -l\` 的清单，直接解开：ShipIt 做的就是这件事，
          # 验它等于验真家伙。（清单里那串名字以前还是中文的「理解引擎.app」，
          # runner 的 locale 是 C.UTF-8，grep 碰到非法字节会判定为二进制而**不计数**，
          # 一条有 10 行的清单会报 0，把排查方向带到完全错误的地方；现在 bundle 名
          # 是 ASCII 的 Astella.app，这个坑不在了，但解包验货这条路本身更实在。）
          # 直接解开更实在：验的是最终落到磁盘上的那份。
          zip_dir="$(mktemp -d "$RUNNER_TEMP/astella-zip.XXXXXX")"
          ditto -x -k "$zip_path" "$zip_dir"
          zipped_app="$(find "$zip_dir" -maxdepth 2 -name '*.app' -type d | head -1)"
          test -n "$zipped_app" || { echo "::error::zip 里没有 .app" >&2; exit 1; }
          echo "zip 里的 bundle: $(basename "$zipped_app")"
          test -x "$zipped_app/Contents/MacOS/Astella" || {
            echo "::error::zip 里的 .app 没有可执行文件" >&2; exit 1; }
          test -s "$zipped_app/Contents/Info.plist" || { echo "::error::zip 里的 .app 没有 Info.plist" >&2; exit 1; }
          test -s "$zipped_app/Contents/Resources/app.asar" || { echo "::error::zip 里的 .app 没有 app.asar" >&2; exit 1; }
          node scripts/macos-signature.cjs "$zipped_app"
          rm -rf "$zip_dir"

          echo '--- 2/4 挂载 dmg 并核对 bundle ---'
          mount_dir="$(mktemp -d "$RUNNER_TEMP/astella-dmg.XXXXXX")"
          hdiutil attach "$dmg_path" -mountpoint "$mount_dir" -nobrowse -quiet
          trap 'hdiutil detach "$mount_dir" -quiet || true; rm -rf "$mount_dir"' EXIT
          # 传了 -mountpoint 就意味着卷一定落在 mount_dir 里，不必再去猜 /Volumes/…：
          # 猜错时会走进"找不到 .app"的分支，而真实原因只是猜错了位置。
          app="$(find "$mount_dir" -maxdepth 2 -name '*.app' -type d | head -1)"
          test -n "$app" && test -d "$app" || { echo "::error::dmg 里找不到 .app" >&2; exit 1; }
          echo "bundle: $app"
          node scripts/macos-signature.cjs "$app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist"
          test -s "$app/Contents/Resources/icon.icns" || { echo "::error::bundle 里没有 icon.icns" >&2; exit 1; }

          # 自动更新的那半条命：electron-updater 被 Vite 拆成懒加载 chunk，
          # 它不在包里 = 没有自动更新。
          #
          # **按内容验，不按路径名验。** 这里此前写死了 `^/out/main/main-*.js$`，
          # 而实际布局是 `out/main/chunks/main-<hash>.js`（2026-10-06 CI 实测，
          # macOS 那条报「asar 里找不到 electron-updater 的懒加载 chunk」——
          # 拆开看 chunk 就在包里、566KB、里面确实引用了 electron-updater 两次，
          # 只是目录多了一层）。按名字验的代价是**打包布局一变就静默失配**，
          # 而症状看起来像"自动更新没打进包"，不像"检查过期了"。
          #
          # 现在：先在 `out/main/**` 里找 `main-*.js` 形状的候选（容得下多一层目录），
          # 再把候选逐个解出来确认里面真的有 electron-updater。
          # 这比原来更强——原检查只验名字，名字对了而内容是别的也照样放行。
          asar="$app/Contents/Resources/app.asar"
          test -s "$asar" || { echo "::error::bundle 里没有 app.asar" >&2; exit 1; }
          npx --yes asar list "$asar" > /tmp/astella-asar-list.txt 2>/dev/null || true
          grep -q '^/out/main/index.js$' /tmp/astella-asar-list.txt || {
            echo "::error::asar 里没有 out/main/index.js" >&2; exit 1; }
          # 注意：这一步没有声明 `shell:`，macOS runner 上跑的是 `/bin/bash` —— 那是
          # **bash 3.2**，没有 `mapfile`。所以候选清单用 `while read` 攒，
          # 不用 bash 4 的内建。
          updater_candidates=()
          while IFS= read -r entry; do
            [ -n "$entry" ] && updater_candidates+=("$entry")
          done < <(grep -E '^/out/main/(.*/)?main-.*\.js$' /tmp/astella-asar-list.txt || true)
          if [ "${#updater_candidates[@]}" -lt 1 ]; then
            echo "::error::asar 里找不到任何懒加载 chunk（out/main/**/main-*.js）" >&2
            grep '^/out/main/' /tmp/astella-asar-list.txt >&2 || true
            exit 1
          fi
          # 提取用 `@electron/asar` 的 API，不用 `asar extract-file` CLI：
          # 后者把文件**写到当前目录**、stdout 一个字节都不给（2026-10-06 实测，
          # 重定向出来是 0 字节），于是"验内容"会永远验不到东西。
          # 库的 API 直接把 Buffer 返回来，写 stdout 即可。同族用法见
          # `scripts/smoke-packaged.mjs` 的 `extractFile`。
          updater_chunk=0
          for candidate in "${updater_candidates[@]}"; do
            node -e 'const { extractFile } = require("@electron/asar"); process.stdout.write(extractFile(process.argv[1], process.argv[2]))' \
              "$asar" "${candidate#/}" > "$RUNNER_TEMP/astella-chunk.js" 2>/dev/null || continue
            if grep -q 'electron-updater' "$RUNNER_TEMP/astella-chunk.js"; then
              updater_chunk=$((updater_chunk + 1))
              echo "electron-updater chunk: ${candidate}"
            fi
          done
          if [ "$updater_chunk" -lt 1 ]; then
            echo "::error::包里的懒加载 chunk 没有一个引用 electron-updater —— 自动更新不会工作" >&2
            exit 1
          fi
          echo "electron-updater chunk 已随包分发：${updater_chunk} 个（候选 ${#updater_candidates[@]} 个）"

          echo '--- 3/4 启动 bundle ---'
          "$app/Contents/MacOS/Astella" > "$RUNNER_TEMP/astella-launch.log" 2>&1 &
          app_pid=$!
          sleep 25
          if ! kill -0 "$app_pid" 2>/dev/null; then
            wait "$app_pid" || true
            echo '::error::已安装的 macOS 应用提前退出' >&2
            tail -40 "$RUNNER_TEMP/astella-launch.log" >&2 || true
            exit 1
          fi
          echo "已安装应用存活（pid ${app_pid}）"
          kill "$app_pid" 2>/dev/null || true
          wait "$app_pid" 2>/dev/null || true

          echo '--- 4/4 latest-mac.yml 指向的就是这份 zip ---'
          cat release/latest-mac.yml
          grep -q "path: astella-${RELEASE_VERSION}-mac-${RELEASE_ARCH}.zip" release/latest-mac.yml || {
            echo "::error::latest-mac.yml 的 path 与实际 zip 不一致" >&2; exit 1; }

          echo 'dmg / zip / bundle / 启动 / 更新清单 全链路通过'
      - name: Upload macOS installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-${{ inputs.mac_arch || 'arm64' }}-${{ github.run_id }}
          path: |
            apps/desktop-client/release/*.dmg
            apps/desktop-client/release/*.zip
            apps/desktop-client/release/*.blockmap
            apps/desktop-client/release/latest-mac.yml
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  summary:
    name: Packaging summary
    # 只汇总，不装不建。windows / macos 是两个互不依赖的并行 job，
    # 一端红了另一端照样把包传上来，最后在这里合成一个结论。
    needs: [windows, macos]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report packaging outcome
        env:
          WINDOWS_RESULT: ${{ needs.windows.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
        run: |
          echo "windows: ${WINDOWS_RESULT}"
          echo "macos:   ${MACOS_RESULT}"
          if [ "${WINDOWS_RESULT}" != "success" ] || [ "${MACOS_RESULT}" != "success" ]; then
            echo "::warning::至少一端没出包，见上面失败步骤"
            exit 1
          fi
