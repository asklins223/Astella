name: CI

# CI 跑本地测试；统一 v* tag 在测试通过后调用服务器部署。
#
# 2026-10-06（用户决定）：**CI = 本地跑得通的那套测试**，逐个包一一对应。
#
# 此前这份文件是 1742 行、8 个 job 的发布流水线：覆盖率门禁、skip/todo 门禁、
# Gitleaks、npm audit ×3、Trivy 镜像扫描 ×3、30 多份真 PostgreSQL 集测、
# 生产 compose 冒烟、备份还原校验、Alpha 基础设施巡检。它带来的不是安全，
# 是**看不懂的红**——本地测试全过，一打 release tag 就红一片，而每次红的
# 都是本地根本不跑的东西。
#
# 2026-10-05 那次实测最能说明问题：CI 停在 **5 个 commit 之前**
# （tag v0.5.0 打完之后又落地了 5 个 commit，没人重跑），报出来的
# `ENOENT: .../node_modules/.pnpm` 在今天的代码里早就修掉了——
# 而它当时看起来就像"CI 坏了"。**红得没有指向，就等于没有信号。**
#
# 现在的口径：**跑什么就等于本地跑什么；跑挂了就是真挂了。**
#
# 移出 CI、但脚本与配置都留在仓库里、需要时按原样接回的：
#   · 覆盖率门禁       `make coverage-gate`
#   · skip/todo 门禁   `make skip-todo-gate`
#   · postgres 集测    `make test-postgres`（要本地库；154 份仍在 package.json 脚本里）
#   · 发布 / compose / Alpha 巡检：脚本与 compose 文件原封不动，只是不再自动跑
#
# 涉及 AI 的部分只跑逻辑：所有用例都是桩 / 固定数据集，不发任何付费网络请求
# （`packages/ai-quality` 的 `pr-gate` 就是 PR 层的固定 Mock 闸）。
#
# 唯一一件"看起来像运维、其实进 CI"的：`backup-scripts` 这一档跑的是
# `infra/backup/backup-scripts.test.sh`——备份/恢复脚本**自身的纯 bash 断言**
# （manifest 形状、rotate 保留策略、restore 的 allowlist 拒绝、schema 校验），
# 不起容器、不连库、也不需要 `age`（那些 `*.dump.age` 只是期望值里的文件名）。
# 上面"移出 CI"的那条指的是**真做一遍备份还原**（要 Docker、MinIO、真库），
# 两者不是一回事。这份纯脚本套件此前只有文档提到、没有任何链路调用它，
# 2026-10-07 起本地 `make verify` 与这里同时跑，缺一侧由
# `ci-workflow-contract` 判红。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  NODE_VERSION: "22"

jobs:
  deploy:
    name: Deploy server on release tags
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: [packages, api, worker, desktop, backup-scripts]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/server-deploy.yml
    secrets: inherit

  # ─── packages/：四个共享包 ──────────────────────────────────────────────
  #
  # 用一个矩阵而不是四个 job：四个包的形状完全一样（npm ci → typecheck → test），
  # 合成一个 job 之后"忘了给某个包装依赖"只会在一处犯。
  #
  # `deps` 是**这个包的 tsconfig 会真的拉进同一个 program 的那些包**。
  # 本仓的 `@astella/*` 全是 `file:` 依赖，npm 把它们做成符号链接（跟着源码走），
  # 但 tsc 读的是被引包自己的 `node_modules` 来解析 `zod` / `drizzle-orm`——
  # 所以被引包必须自己装过，这是 npm workspace 提升掩盖掉的那一层。
  packages:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Shared contracts
            path: packages/shared
            deps: packages/shared
          - label: Agent core
            path: packages/agent-core
            deps: packages/shared,packages/agent-core
          - label: Agent host
            path: packages/agent-host
            deps: >-
              packages/shared,packages/card-generation,
              packages/agent-core,packages/agent-host
          # AI 质量层：PR Mock。校验数据集完整性、标签覆盖、评分器逻辑，
          # 全程固定桩，不碰付费网络——这正是"AI 任务只跑通逻辑"的那一支。
          - label: AI quality (PR mock)
            path: packages/ai-quality
            deps: packages/shared,packages/ai-quality
            pr_gate: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            packages/shared/package-lock.json
            packages/card-generation/package-lock.json
            packages/agent-core/package-lock.json
            packages/agent-host/package-lock.json
            packages/ai-quality/package-lock.json

      - name: Install dependencies
        run: |
          IFS=',' read -ra dirs <<< "${{ matrix.deps }}"
          for dir in "${dirs[@]}"; do
            dir="$(echo "$dir" | tr -d '[:space:]')"
            echo "── npm ci $dir"
            (cd "$dir" && npm ci --no-audit --no-fund)
          done

      - name: Typecheck ${{ matrix.path }}
        working-directory: ${{ matrix.path }}
        run: npm run typecheck

      - name: Test ${{ matrix.path }}
        working-directory: ${{ matrix.path }}
        run: npm test

      - name: PR mock quality gate
        if: matrix.pr_gate == '1'
        working-directory: ${{ matrix.path }}
        run: npm run pr-gate

  # ─── apps/api ─────────────────────────────────────────────────────────
  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 单测会在模块加载时 import db.ts，那儿建一个 postgres 连接池。池是懒的
      # （不查询就不连），但默认 URL 用的 docker-compose 主机名 `postgres`
      # 在 CI runner 上不解析——DNS 查不到会把 job 挂到超时。这里给一个
      # 明确不可达的地址：池照建、照关，单测里所有 db 方法都是桩。
      DATABASE_URL_API: postgres://ci:ci@127.0.0.1:1/ci
      DATABASE_URL_WORKER: postgres://ci:ci@127.0.0.1:1/ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            packages/shared/package-lock.json
            packages/card-generation/package-lock.json
            packages/agent-core/package-lock.json
            packages/agent-host/package-lock.json
            workers/ai-worker/package-lock.json
            apps/api/package-lock.json

      # `workers/ai-worker` 在这一档里不是"顺手装的"：api 的 program **真的包含**
      # worker 的源码（`src/handlers/companion-task-memory.ts`、`src/lib/logger.ts`
      # 等会经相对 import 被拉进来），而那份源码 import `postgres` / `pino` /
      # `prom-client`——它们装在 worker 的 node_modules 里。少装这一档，
      # `Typecheck API` 就报三条 TS2307（2026-10-06 冷缓存演练实测）。
      - name: Install dependencies
        run: |
          for dir in packages/shared packages/card-generation packages/agent-core \
                      packages/agent-host workers/ai-worker apps/api; do
            echo "── npm ci $dir"
            (cd "$dir" && npm ci --no-audit --no-fund)
          done

      - name: Typecheck API
        working-directory: apps/api
        run: npm run typecheck

      - name: Test API
        working-directory: apps/api
        run: npm test

  # ─── workers/ai-worker ────────────────────────────────────────────────
  worker:
    name: Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL_WORKER: postgres://ci:ci@127.0.0.1:1/ci
      DATABASE_URL_API: postgres://ci:ci@127.0.0.1:1/ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            packages/shared/package-lock.json
            packages/card-generation/package-lock.json
            packages/agent-core/package-lock.json
            packages/agent-host/package-lock.json
            packages/ai-quality/package-lock.json
            workers/ai-worker/package-lock.json
            apps/api/package-lock.json

      # `apps/api` 在这一档里同样不是"顺手装的"：`workers/ai-worker/src/integration-tests/`
      # 里有文件（`agent-goals-postgres.integration.ts` 等）**直接相对 import
      # `apps/api/src/...`**，而 api 那边 import `zod` / `postgres` / `pino` /
      # `y-prosemirror`。少装这一档，`TypeCheck Worker` 报十来条 TS2307（2026-10-06
      # 冷缓存演练实测）。
      #
      # 换句话说：**api 与 worker 的 typecheck program 是互相咬合的**，任何一边少装
      # 对方都会红。旧的 CI 之所以没踩到，是因为它在每一个 job 里都把两套都装齐了。
      - name: Install dependencies
        run: |
          for dir in packages/shared packages/card-generation packages/agent-core \
                      packages/agent-host packages/ai-quality apps/api workers/ai-worker; do
            echo "── npm ci $dir"
            (cd "$dir" && npm ci --no-audit --no-fund)
          done

      - name: Typecheck Worker
        working-directory: workers/ai-worker
        run: npm run typecheck

      - name: Test Worker
        working-directory: workers/ai-worker
        run: npm test

  # ─── apps/desktop-client ──────────────────────────────────────────────
  desktop:
    name: Desktop client
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            packages/shared/package-lock.json
            apps/desktop-client/package-lock.json

      - name: Install dependencies
        run: |
          for dir in packages/shared apps/desktop-client; do
            echo "── npm ci $dir"
            (cd "$dir" && npm ci --no-audit --no-fund)
          done

      - name: Typecheck desktop client
        working-directory: apps/desktop-client
        run: npm run typecheck

      # **先构建再测**：`scripts/runtime-asset-containment.test.mjs` 里那几条量的是
      # "最终打包进去的是什么"——`out/renderer/assets` 下的房间层、Live2D 运行时、
      # 任务场景原图是否与源一致，以及已退役的旧素材有没有混进去。它们读的是构建
      # 产物，所以没有 `out/` 就没有可量的东西。
      #
      # 2026-10-06 实测：少了这一步，`Test desktop client` 在干净 runner 上红 3 条
      # （`expected [] to include 'assets/companion/live2d-v3/whale/…'` 之类）。
      # 本地一直没红，是因为工作树里躺着上一次构建留下的 `out/`——**本地的"绿"
      # 依赖一个不在版本控制里的产物目录**，这正是「本地过、CI 不过」最阴的一种。
      - name: Build desktop client
        working-directory: apps/desktop-client
        run: npm run build

      - name: Test desktop client
        working-directory: apps/desktop-client
        run: npm test

      # 打包与两个场景变体（v1 / v2）由 desktop-client.yml 负责，
      # 那条流水线关心的是产物而不是测试，所以不混进这里。

  # ─── 运维 shell 脚本自测 ──────────────────────────────────────────────
  #
  # 与 `make verify` 里那一条是同一份：备份/恢复脚本的 53 条断言（卷名、mc 别名、
  # 禁用库名清单、校验值命令）。只依赖 bash + mktemp，所以不装 Node、不起服务。
  # 两边必须同时有它——`ci-workflow-contract` 现在专门盯着这条对账。
  backup-scripts:
    name: Backup scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Run backup script self-tests
        run: bash infra/backup/backup-scripts.test.sh
