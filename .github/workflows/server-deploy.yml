name: Server deploy

# Called only after the existing CI jobs pass for a server release tag (s-v*).
on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: server-production
  cancel-in-progress: false

jobs:
  images:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 's-v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      api: ${{ steps.api.outputs.digest }}
      worker: ${{ steps.worker.outputs.digest }}
      edge_tts: ${{ steps.edge_tts.outputs.digest }}
      embedding: ${{ steps.embedding.outputs.digest }}
      image_prefix: ${{ steps.names.outputs.prefix }}
      backup: ${{ steps.backup.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate release tag and source version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # 服务端版本线：release/version.json 是唯一来源，tag 必须是 s-v<该版本>。
          node .github/scripts/version-contract.mjs --check
          node .github/scripts/version-contract.mjs --tag "$RELEASE_TAG"
      - name: Test deployment scripts
        run: |
          python3 infra/deploy/__tests__/bundle.test.py
          shellcheck infra/deploy/*.sh
      - name: Resolve lowercase image names
        id: names
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "prefix=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build API production image
        id: api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: prod
          platforms: linux/amd64
          push: true
          tags: ${{ steps.names.outputs.prefix }}-api:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build worker production image
        id: worker
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: workers/ai-worker/Dockerfile
          target: prod
          platforms: linux/amd64
          push: true
          tags: ${{ steps.names.outputs.prefix }}-worker:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
      - name: Build TTS image
        id: edge_tts
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/edge-tts/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.names.outputs.prefix }}-edge-tts:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=edge-tts
          cache-to: type=gha,mode=max,scope=edge-tts
      - name: Build local embedding image
        id: embedding
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/embedding/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.names.outputs.prefix }}-embedding:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=embedding
          cache-to: type=gha,mode=max,scope=embedding

      - name: Build standby object store from pinned upstream source
        id: backup
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/storage-backup/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.names.outputs.prefix }}-storage-backup:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=storage-backup
          cache-to: type=gha,mode=max,scope=storage-backup

  deploy:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Write image digests
        env:
          PREFIX: ${{ needs.images.outputs.image_prefix }}
          API_DIGEST: ${{ needs.images.outputs.api }}
          WORKER_DIGEST: ${{ needs.images.outputs.worker }}
          TTS_DIGEST: ${{ needs.images.outputs.edge_tts }}
          EMBEDDING_DIGEST: ${{ needs.images.outputs.embedding }}
          BACKUP_DIGEST: ${{ needs.images.outputs.backup }}
        run: |
          printf 'API_IMAGE=%s-api@%s\nWORKER_IMAGE=%s-worker@%s\nEDGE_TTS_IMAGE=%s-edge-tts@%s\nEMBEDDING_IMAGE=%s-embedding@%s\nBACKUP_IMAGE=%s-storage-backup@%s\n' \
            "$PREFIX" "$API_DIGEST" "$PREFIX" "$WORKER_DIGEST" "$PREFIX" "$TTS_DIGEST" "$PREFIX" "$EMBEDDING_DIGEST" "$PREFIX" "$BACKUP_DIGEST" > deployment-images.env
      - name: Deploy exact commit over verified SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          task_ssh_dir="$(mktemp -d)"
          trap 'rm -rf "$task_ssh_dir"' EXIT
          chmod 700 "$task_ssh_dir"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$task_ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$task_ssh_dir/known_hosts"
          chmod 600 "$task_ssh_dir/key" "$task_ssh_dir/known_hosts"
          { printf '%s\n%s\n' "$GHCR_USER" "$GHCR_TOKEN";
            # 部署脚本随 release 一起落地（`/opt/astella/releases/<sha>-<set>/infra/deploy/`）：
            # 机器的 `/usr/local/lib/astella/` 由管理员更新，带上这一份，管理员可以就地
            # `install` 成与这一版一致的脚本，不必再去仓库里取。
            tar -czf - docker-compose.yml docker-compose.deploy.yml deployment-images.env config infra/postgres infra/deploy infra/embedding;
          } | ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            -o UserKnownHostsFile="$task_ssh_dir/known_hosts" -i "$task_ssh_dir/key" \
            -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" "deploy $GITHUB_SHA"

      # 可选：部署成功后把这次服务端发布登记到 Release Center（server_releases），
      # 供 GET /app/server-version 与管理面板展示。这是**可选步骤**：secrets 不存在时
      # 直接跳过，登记失败也只 warning，绝不让它把已经成功的部署判红。
      #
      # 判断条件放在 env + shell 里而不是 `if:`：GitHub 表达式里直接引用不存在的
      # secret 会得到一个空字符串，`if:` 上不好读，也不方便本地演练。
      - name: Register server release in Release Center
        env:
          RELEASE_CENTER_URL: ${{ secrets.RELEASE_CENTER_URL }}
          RELEASE_CENTER_TOKEN: ${{ secrets.RELEASE_CENTER_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          API_DIGEST: ${{ needs.images.outputs.api }}
          WORKER_DIGEST: ${{ needs.images.outputs.worker }}
          TTS_DIGEST: ${{ needs.images.outputs.edge_tts }}
          EMBEDDING_DIGEST: ${{ needs.images.outputs.embedding }}
          BACKUP_DIGEST: ${{ needs.images.outputs.backup }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_CENTER_URL:-}" ] || [ -z "${RELEASE_CENTER_TOKEN:-}" ]; then
            echo "Release Center 未配置（RELEASE_CENTER_URL / RELEASE_CENTER_TOKEN），跳过服务端版本登记"
            exit 0
          fi
          base="${RELEASE_CENTER_URL%/}"
          # payload 用 node 生成：notes 是长中文句子，手写 JSON 容易在引号与换行上出错。
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const source = JSON.parse(readFileSync("release/version.json", "utf8"));
            writeFileSync("server-release-payload.json", `${JSON.stringify({
              version: source.version,
              tag: process.env.RELEASE_TAG,
              commit: process.env.GITHUB_SHA,
              imageDigests: {
                api: process.env.API_DIGEST,
                worker: process.env.WORKER_DIGEST,
                edgeTts: process.env.TTS_DIGEST,
                embedding: process.env.EMBEDDING_DIGEST,
              },
              releasedAt: new Date().toISOString(),
              notes: source.notes.join("\n\n"),
            }, null, 2)}\n`);
          '
          if curl -fsS -X POST "${base}/internal/server-releases" \
              -H "Authorization: Bearer ${RELEASE_CENTER_TOKEN}" \
              -H 'Content-Type: application/json' \
              --data-binary @server-release-payload.json; then
            echo "服务端版本已登记到 Release Center"
          else
            echo "::warning::服务端版本登记失败（不阻塞部署；配置修好后可人工重放这一步）"
          fi
          rm -f server-release-payload.json
