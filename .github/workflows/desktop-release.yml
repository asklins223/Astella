name: Desktop release

# 与服务端共用 release/version.json 和 v<version> tag。
# Windows 与 macOS 安装包、桌面质量检查全部成功后先上传 Draft，再公开 Release。
# 资产上传完成前不公开，避免更新器读到未上传完整的安装包或更新清单。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: 版本号（留空则用 tag / release/version.json）
        type: string
        default: ""
      mac_arch:
        description: macOS 架构
        type: choice
        default: arm64
        options:
          - arm64
          - x64

permissions:
  contents: read

# 同一个 tag 被重新推送时，新一轮应当取代上一轮，而不是两轮都把 Release 传一遍。
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  resolve:
    name: Resolve release version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      from_tag: ${{ steps.resolve.outputs.from_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop-client/package-lock.json

      - name: Resolve and verify the release version
        id: resolve
        run: |
          set -euo pipefail
          node .github/scripts/desktop-version.mjs --check

          requested="${{ inputs.version }}"
          is_tag="false"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag_version="$(node .github/scripts/desktop-version.mjs --tag "${{ github.ref_name }}")"
            is_tag="true"
            if [ -z "$requested" ]; then requested="$tag_version"; fi
            # tag 与唯一来源不一致时直接停：继续下去只会得到一个"标题写 v1.2.0、
            # 产物里却是另一个版本"的 Release，而更新器读到的是后者。
            source_version="$(node -e "console.log(require('./release/version.json').version)")"
            if [ "$tag_version" != "$source_version" ]; then
              echo "::error::tag ${{ github.ref_name }} 指向 $tag_version，但 release/version.json 是 $source_version。请先改版本号再打 tag。" >&2
              exit 1
            fi
          fi

          if [ -n "$requested" ]; then
            node .github/scripts/desktop-version.mjs --set "$requested"
          fi
          version="$(node -e "console.log(require('./release/version.json').version)")"
          node .github/scripts/desktop-version.mjs --check

          tag="v${version}"
          if [ "${{ github.ref_type }}" = "tag" ]; then tag="${{ github.ref_name }}"; fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "from_tag=${is_tag}" >> "$GITHUB_OUTPUT"
          echo "release tag: ${tag}  version: ${version}"

  build:
    name: Build both platforms
    needs: resolve
    uses: ./.github/workflows/desktop-package.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
      mac_arch: ${{ inputs.mac_arch || 'arm64' }}
    secrets: inherit

  quality:
    name: Verify packaged desktop quality
    needs: resolve
    uses: ./.github/workflows/desktop-client.yml

  release:
    name: Publish release
    needs: [resolve, build, quality]
    # 只有带 tag 的那次才发 Release。手动触发的是"打个包看看"，不该改写公开的发布页。
    if: needs.resolve.outputs.from_tag == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop-client/package-lock.json

      - name: Download both platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: artifacts
          merge-multiple: true

      - name: Verify cross-platform version consistency
        env:
          WINDOWS_VERSION: ${{ needs.build.outputs.windows_version }}
          MACOS_VERSION: ${{ needs.build.outputs.macos_version }}
          MACOS_ARCH: ${{ needs.build.outputs.macos_arch }}
          EXPECTED_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          echo "expected=${EXPECTED_VERSION} windows=${WINDOWS_VERSION} macos=${MACOS_VERSION}"
          test "$WINDOWS_VERSION" = "$EXPECTED_VERSION"
          test "$MACOS_VERSION" = "$EXPECTED_VERSION"

          # 两个平台必须打出**同一个版本**的包：自动更新按版本号判新旧，
          # 两端版本分叉意味着"一半用户永远升不到最新"。
          win_installer="artifacts/astella-${EXPECTED_VERSION}-win-x64.exe"
          win_blockmap="${win_installer}.blockmap"
          mac_zip="artifacts/astella-${EXPECTED_VERSION}-mac-${MACOS_ARCH}.zip"
          mac_dmg="artifacts/astella-${EXPECTED_VERSION}-mac-${MACOS_ARCH}.dmg"
          # 只读诊断脚本：用户机器上「双击安装包没反应、也没报错」时，只有它能分层判断故障在哪一层。
          diagnose="artifacts/diagnose-windows-installer.ps1"

          for f in "$win_installer" "$win_blockmap" "$mac_zip" "$mac_dmg" "$diagnose"; do
            if [ ! -s "$f" ]; then echo "::error::缺少发布产物: $f" >&2; exit 1; fi
            echo "ok  $f  ($(du -h "$f" | cut -f1))"
          done

          # electron-builder 在 publish.provider 配好时会写出这两个更新清单。
          # 少了 latest.yml，Windows 客户端就永远看不到新版本；
          # 少了 latest-mac.yml，macOS 同理。**必须在上传前查**。
          latest_win="artifacts/latest.yml"
          latest_mac="artifacts/latest-mac.yml"
          if [ ! -s "$latest_win" ]; then
            echo "::error::缺少 ${latest_win}：没有它，Windows 自动更新拿不到版本信息。" >&2
            exit 1
          fi
          if [ ! -s "$latest_mac" ]; then
            echo "::error::缺少 ${latest_mac}：发布资产不完整。" >&2
            exit 1
          else
            echo "ok  ${latest_mac}"
          fi

          echo "--- latest.yml ---"
          cat "$latest_win"

      - name: Write release notes
        run: node .github/scripts/release-notes.mjs --output release-notes.md

      - name: Create draft release and upload all assets
        id: upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: Astella ${{ needs.resolve.outputs.tag }}
          # 产品更新内容与版本号都由 release/version.json 管理。
          generate_release_notes: false
          body_path: release-notes.md
          draft: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(needs.resolve.outputs.version, '-') }}
          files: |
            artifacts/latest.yml
            artifacts/latest-mac.yml
            artifacts/astella-${{ needs.resolve.outputs.version }}-win-x64.exe
            artifacts/astella-${{ needs.resolve.outputs.version }}-win-x64.exe.blockmap
            artifacts/astella-${{ needs.resolve.outputs.version }}-mac-${{ needs.build.outputs.macos_arch }}.zip
            artifacts/astella-${{ needs.resolve.outputs.version }}-mac-${{ needs.build.outputs.macos_arch }}.dmg
            artifacts/diagnose-windows-installer.ps1

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.upload.outputs.id }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_ID" ]; then
            echo "::error::Release action 没有返回 Release ID，无法公开" >&2
            exit 1
          fi
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -F draft=false >/dev/null
          echo "全部资产已上传，Release ${{ needs.resolve.outputs.tag }} 已公开"
