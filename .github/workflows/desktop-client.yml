name: Desktop client

on:
  workflow_dispatch:
  # 同 ci.yml：只在打 tag 时跑，main 的普通推送不再触发。
  push:
    tags: ["desktop-v*", "v*"]

permissions:
  contents: read

concurrency:
  group: desktop-client-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  shared-contracts:
    name: Shared contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: packages/shared/package-lock.json
      - name: Install shared dependencies
        working-directory: packages/shared
        run: npm ci --no-audit --no-fund
      - name: Typecheck shared contracts
        working-directory: packages/shared
        run: npm run typecheck
      - name: Test shared contracts
        working-directory: packages/shared
        run: npm test

  variant-quality:
    name: ${{ matrix.variant }} quality and build
    needs: shared-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [v1, v2]
    env:
      VITE_HOME_SCENE_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            apps/desktop-client/package-lock.json
            packages/shared/package-lock.json
      - name: Install linked shared dependencies
        working-directory: packages/shared
        run: npm ci --no-audit --no-fund
      - name: Install desktop-client dependencies
        working-directory: apps/desktop-client
        run: npm ci --no-audit --no-fund
      - name: Typecheck desktop client (${{ matrix.variant }})
        working-directory: apps/desktop-client
        run: npm run typecheck
      - name: Validate source room layers (${{ matrix.variant }})
        working-directory: apps/desktop-client
        run: npm run validate:room-layers
      - name: Build desktop client (${{ matrix.variant }})
        working-directory: apps/desktop-client
        run: npm run build
      - name: Validate emitted room layers (${{ matrix.variant }})
        working-directory: apps/desktop-client
        run: npm run validate:room-layers:output
      - name: Test desktop client (${{ matrix.variant }})
        working-directory: apps/desktop-client
        run: npm test
      - name: Upload desktop-client build (${{ matrix.variant }})
        uses: actions/upload-artifact@v4
        with:
          name: desktop-client-${{ matrix.variant }}-out-${{ github.run_id }}
          path: apps/desktop-client/out
          if-no-files-found: error
          retention-days: 14

  package-smoke:
    name: Package smoke (${{ matrix.label }})
    needs: variant-quality
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
          - os: windows-latest
            label: windows-x64
          - os: macos-14
            label: macos-native
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      VITE_HOME_SCENE_VARIANT: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            apps/desktop-client/package-lock.json
            packages/shared/package-lock.json
      - name: Install linked shared dependencies
        working-directory: packages/shared
        run: npm ci --no-audit --no-fund
      - name: Install desktop-client dependencies
        working-directory: apps/desktop-client
        run: npm ci --no-audit --no-fund
      - name: Install Linux launch dependencies
        if: runner.os == 'Linux'
        working-directory: apps/desktop-client
        run: npx playwright install-deps chromium
      - name: Build V2 renderer
        working-directory: apps/desktop-client
        run: npm run build
      - name: Create unpacked application
        working-directory: apps/desktop-client
        run: npx electron-builder --dir
      # 可执行文件叫什么是 `electron-builder.yml` 的 `productName` 决定的，**不在这里写死**。
      #
      # 2026-10-06：这三步此前找的是 `AI Learn`——产品名早就换过一轮（那之后叫
      # 「理解引擎」，现在叫 Astella），
      # 而这三条 locate 一直被上游的红挡着（v1/v2 那两条 job 从未成功过），
      # 所以从没人发现它已经对不上。写死名字的代价就是**改名时静默坏掉**，
      # 而症状（"找不到打包产物"）看起来像打包坏了，不像改名漏改。
      - name: Resolve packaged executable name
        shell: bash
        run: |
          product_name="$(node -e '
            const s = require("fs").readFileSync("apps/desktop-client/electron-builder.yml", "utf8");
            const m = s.match(/^productName:[ \t]*(.+)$/m);
            if (!m) { throw new Error("electron-builder.yml 里没有 productName"); }
            process.stdout.write(m[1].trim());
          ')"
          test -n "$product_name"
          echo "PRODUCT_NAME=$product_name" >> "$GITHUB_ENV"
          echo "打包出来的可执行文件名 = $product_name"
      - name: Locate Linux package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Linux 上可执行文件**不叫 productName**：electron-builder 用的是
          # package.json 的 `name`（实测产出 `astella-desktop-client`），
          # 而 Windows/macOS 用的是 productName（现在是 Astella）。既然这条规则与产品名无关，
          # 就别按名字找——按**排除 Electron 自带的那些**来找：顶层可执行的
          # 文件里，去掉沙箱、crashpad 与所有 .so，剩下的就是应用本体。
          app_bin="$(find apps/desktop-client/release/linux-unpacked -maxdepth 1 -type f -executable \
            ! -name 'chrome-sandbox' ! -name 'chrome_crashpad_handler' ! -name '*.so*' -print -quit)"
          test -n "$app_bin" || { echo >&2 "没找到应用本体（linux-unpacked 里有什么：）"; ls -la apps/desktop-client/release/linux-unpacked | head -24; exit 1; }
          app_bin="$(realpath "$app_bin")"
          echo "ASTELLA_PACKAGED_APP=$app_bin" >> "$GITHUB_ENV"
          echo "Linux 应用本体 = $app_bin"
      - name: Locate Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Get-ChildItem -Path apps/desktop-client/release/win-unpacked -Filter "$env:PRODUCT_NAME.exe" -Recurse | Select-Object -First 1
          if ($null -eq $app) { throw "Packaged $env:PRODUCT_NAME.exe not found" }
          "ASTELLA_PACKAGED_APP=$($app.FullName)" >> $env:GITHUB_ENV
      - name: Locate macOS package
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app_bin="$(find apps/desktop-client/release -path "*/Contents/MacOS/${PRODUCT_NAME}" -type f -print -quit)"
          test -n "$app_bin" || { echo >&2 "没找到可执行文件 ${PRODUCT_NAME}（release 下有什么：）"; find apps/desktop-client/release -maxdepth 4 -name MacOS -type d; exit 1; }
          app_bin="$(realpath "$app_bin")"
          echo "ASTELLA_PACKAGED_APP=$app_bin" >> "$GITHUB_ENV"
      - name: Verify packaged boundary and asset containment
        working-directory: apps/desktop-client
        env:
          ASTELLA_PACKAGED_PREFLIGHT_ONLY: "1"
        run: npm run package:smoke
      - name: Smoke packaged Linux app
        if: runner.os == 'Linux'
        shell: bash
        working-directory: apps/desktop-client
        env:
          ASTELLA_PACKAGED_OFFLINE_ONLY: "1"
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1440x900x24' npm run package:smoke
      - name: Smoke packaged Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: apps/desktop-client
        env:
          ASTELLA_PACKAGED_OFFLINE_ONLY: "1"
        run: npm run package:smoke
      - name: Smoke packaged macOS app
        if: runner.os == 'macOS'
        shell: bash
        working-directory: apps/desktop-client
        env:
          ASTELLA_PACKAGED_OFFLINE_ONLY: "1"
        run: npm run package:smoke
      - name: Upload unpacked desktop-client package
        uses: actions/upload-artifact@v4
        with:
          name: desktop-client-${{ matrix.label }}-${{ github.run_id }}
          path: |
            apps/desktop-client/release
            .impeccable/evidence/package-smoke-offline.json
          if-no-files-found: error
          retention-days: 14
