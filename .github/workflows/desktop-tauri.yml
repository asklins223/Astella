name: Desktop Tauri shell

# Tauri 外壳的构建与验证（迁移期并行于 Electron 流水线）。
# 手动运行：Actions → Desktop Tauri shell → Run workflow。
# macOS 出 .app/DMG（CI=true 绕开 macOS 26 的 Finder 脚本超时）；
# Windows 只做编译检查——安装器与 WebView2 行为尚未在实机验证。

on:
  workflow_dispatch:
    inputs:
      only:
        description: "重跑范围：all / macos / windows"
        type: choice
        options: [all, macos, windows]
        default: all
  workflow_call:

permissions:
  contents: read

concurrency:
  group: desktop-tauri-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  macos:
    name: macOS build, tests and package
    if: github.event_name == 'workflow_call' || inputs.only == 'all' || inputs.only == 'macos'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            packages/shared/package-lock.json
            apps/desktop-client/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-tauri
      - name: Install shared dependencies
        working-directory: packages/shared
        run: npm ci --no-audit --no-fund
      - name: Install desktop dependencies
        working-directory: apps/desktop-client
        run: npm ci --no-audit --no-fund
      - name: Typecheck renderer
        working-directory: apps/desktop-client
        run: npm run typecheck
      - name: Build renderer
        working-directory: apps/desktop-client
        run: npm run build
      - name: Prepare target dirs (sherpa build script expects deps/)
        working-directory: apps/desktop-tauri
        run: mkdir -p target/debug/deps target/debug/examples target/release/deps target/release/examples sherpa-runtime && touch sherpa-runtime/placeholder.dll; rm -rf target/debug/build/sherpa-rs* target/release/build/sherpa-rs*
      - name: Rust tests
        working-directory: apps/desktop-tauri
        run: cargo test --features voice-engine
      - name: Package (app + dmg)
        working-directory: apps/desktop-tauri
        env:
          CI: "true"
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          node scripts/package-release.mjs --version "$VERSION" --skip-renderer --features voice-engine
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: astella-tauri-macos
          path: apps/desktop-tauri/dist/**
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows compile check
    if: inputs.only == 'all' || inputs.only == 'windows'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-tauri
      - name: Prepare target dirs (sherpa build script expects deps/)
        working-directory: apps/desktop-tauri
        shell: bash
        run: mkdir -p target/debug/deps target/debug/examples target/release/deps target/release/examples sherpa-runtime && touch sherpa-runtime/placeholder.dll; rm -rf target/debug/build/sherpa-rs* target/release/build/sherpa-rs*
      - name: Stub renderer dist (compile check only)
        working-directory: apps/desktop-client
        shell: bash
        run: mkdir -p out/renderer && printf '<!doctype html><meta charset="utf-8"><title>stub</title>' > out/renderer/index.html
      - name: Cargo check (all targets)
        working-directory: apps/desktop-tauri
        run: cargo check --all-targets --features voice-engine
      - name: Rust tests (non-Mock runtime paths compile on Windows)
        working-directory: apps/desktop-tauri
        run: cargo test --no-run --features voice-engine

  windows-package:
    name: Windows package (manual)
    if: github.event_name == 'workflow_dispatch' && (inputs.only == 'all' || inputs.only == 'windows')
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            packages/shared/package-lock.json
            apps/desktop-client/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-tauri
      - name: Install shared dependencies
        working-directory: packages/shared
        run: npm ci --no-audit --no-fund
      - name: Install desktop dependencies
        working-directory: apps/desktop-client
        run: npm ci --no-audit --no-fund
      - name: Build renderer
        working-directory: apps/desktop-client
        run: npm run build
      - name: Prepare target dirs (sherpa build script expects deps/)
        working-directory: apps/desktop-tauri
        shell: bash
        run: mkdir -p target/debug/deps target/debug/examples target/release/deps target/release/examples sherpa-runtime && touch sherpa-runtime/placeholder.dll; rm -rf target/debug/build/sherpa-rs* target/release/build/sherpa-rs*
      - name: Package (NSIS)
        working-directory: apps/desktop-tauri
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          node scripts/package-release.mjs --version "$VERSION" --skip-renderer --features voice-engine
      - name: Smoke test installed app
        working-directory: apps/desktop-tauri
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem -Path dist -Recurse -Filter '*setup.exe' | Select-Object -First 1
          if (-not $setup) { throw 'installer artifact missing' }
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $candidates = @(
            (Join-Path $env:LOCALAPPDATA 'Astella\Astella.exe'),
            (Join-Path $env:LOCALAPPDATA 'Astella\astella-desktop-tauri.exe'),
            (Join-Path $env:ProgramFiles 'Astella\Astella.exe'),
            (Join-Path $env:ProgramFiles 'Astella\astella-desktop-tauri.exe')
          )
          $exe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw 'installed exe not found' }
          Write-Host "Installed: $exe"
          $logPath = Join-Path $env:LOCALAPPDATA 'Astella\startup.log'
          Remove-Item $logPath -ErrorAction SilentlyContinue
          $env:ASTELLA_STARTUP_LOG = '1'
          try { Add-MpPreference -ExclusionPath (Split-Path $exe) -ErrorAction Stop; Write-Host 'Defender exclusion added' } catch { Write-Warning "Defender exclusion failed: $_" }
          $md = Join-Path $env:TEMP 'astella-launch-md.md'
          Set-Content -Path $md -Value '# launch'
          $proc = Start-Process -FilePath $exe -ArgumentList $md -PassThru -WorkingDirectory (Split-Path $exe)
          Start-Sleep -Seconds 120
          $live = Get-Process -Id $proc.Id -ErrorAction SilentlyContinue
          if (-not $live) { throw 'app exited during startup' }
          $live = Get-Process -Id $proc.Id -ErrorAction SilentlyContinue
          if (-not $live) { throw 'app exited during startup (second check)' }
          $ws = [math]::Round($live.WorkingSet64 / 1MB, 1)
          Write-Host "Running: pid=$($proc.Id) session=$($live.SessionId) threads=$($live.Threads.Count) cpu=$($live.CPU) ws=${ws}MiB mainWindow=$($live.MainWindowHandle) title='$($live.MainWindowTitle)'"
          Write-Host ("PowerShell session=" + (Get-Process -Id $PID).SessionId)
          Get-ChildItem -Path (Split-Path $exe) | Select-Object -ExpandProperty Name | Out-String | Write-Host
          $md = Join-Path $env:TEMP 'astella-second-instance.md'
          Set-Content -Path $md -Value '# smoke'
          $second = Start-Process -FilePath $exe -ArgumentList $md -PassThru
          Start-Sleep -Seconds 8
          $secondLive = Get-Process -Id $second.Id -ErrorAction SilentlyContinue
          if ($secondLive) { Write-Warning 'second instance still running'; Stop-Process -Id $second.Id -Force } else { Write-Host 'second instance exited after forwarding' }
          if (Test-Path $logPath) { Write-Host 'startup.log:'; Get-Content $logPath | ForEach-Object { Write-Host "  $_" } } else { Write-Host 'startup.log: (missing)' }
          $children = Get-CimInstance Win32_Process -Filter "ParentProcessId=$($proc.Id)" | Select-Object ProcessId, Name
          Write-Host ("Children: " + (($children | ForEach-Object { "$($_.Name)#$($_.ProcessId)" }) -join ', '))
          $runtimeDirs = Get-ChildItem 'C:\Program Files (x86)\Microsoft\EdgeWebView\Application' -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
          Write-Host ("WebView2 runtime dirs: " + ($runtimeDirs -join ','))
          $webview = Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.ProcessName -like '*msedgewebview2*' }
          if ($webview) {
            $webview | Select-Object ProcessName, Id, WorkingSet64 | Format-Table | Out-String | Write-Host
          } else {
            Write-Warning 'WebView2 processes not found (runtime/session issue?)'
            Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-5)} -ErrorAction SilentlyContinue | Where-Object { $_.Message -like '*astella*' } | Select-Object -First 3 | Format-List | Out-String | Write-Host
          }
          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $shot = Join-Path (Get-Location) 'dist\smoke-screen.png'
            $bitmap.Save($shot, [System.Drawing.Imaging.ImageFormat]::Png)
            Write-Host "Screenshot: $shot"
          } catch { Write-Warning "screenshot failed: $_" }
          Stop-Process -Id $proc.Id -Force
          Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.ProcessName -like '*msedgewebview2*' } | Stop-Process -Force
          $pdf = Join-Path $env:TEMP 'astella-smoke.pdf'
          Remove-Item $pdf -ErrorAction SilentlyContinue
          $env:ASTELLA_PDF_REHEARSAL = $pdf
          $pdfProc = Start-Process -FilePath $exe -PassThru -WorkingDirectory (Split-Path $exe)
          Wait-Process -Id $pdfProc.Id -Timeout 90 -ErrorAction SilentlyContinue
          Remove-Item Env:ASTELLA_PDF_REHEARSAL
          Start-Sleep -Seconds 3
          if (Test-Path $pdf) {
            $bytes = [IO.File]::ReadAllBytes($pdf)
            $head = [Text.Encoding]::ASCII.GetString($bytes[0..4])
            if ($head -like '%PDF*' -and $bytes.Length -gt 1000) {
              Write-Host "PDF export OK ($($bytes.Length) bytes, head=$head)"
            } else {
              Write-Warning "PDF head unexpected: $head ($($bytes.Length) bytes)"
            }
          } else {
            Write-Warning 'PDF export file missing'
          }
          $env:ASTELLA_CLIPBOARD_REHEARSAL = '1'
          $clipProc = Start-Process -FilePath $exe -PassThru -WorkingDirectory (Split-Path $exe)
          Wait-Process -Id $clipProc.Id -Timeout 60 -ErrorAction SilentlyContinue
          Remove-Item Env:ASTELLA_CLIPBOARD_REHEARSAL
          Write-Host 'startup.log (after clipboard):'
          Get-Content $logPath | ForEach-Object { Write-Host "  $_" }
          $modelDir = Join-Path $env:APPDATA 'com.astella.desktop\voice-models'
          New-Item -ItemType Directory -Force -Path $modelDir | Out-Null
          $modelFile = Join-Path $modelDir 'model.int8.onnx'
          $tokensFile = Join-Path $modelDir 'tokens.txt'
          if (-not (Test-Path $modelFile)) {
            $tar = Join-Path $env:TEMP 'sense-voice.tar.bz2'
            curl.exe -L --fail --silent --show-error -o $tar 'https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17.tar.bz2'
            $modelRoot = Join-Path $env:TEMP 'astella-asr-model'
            if (Test-Path $modelRoot) { Remove-Item $modelRoot -Recurse -Force }
            New-Item -ItemType Directory -Force -Path $modelRoot | Out-Null
            tar -xjf $tar -C $modelRoot
            $src = Get-ChildItem $modelRoot -Recurse -Filter 'model.int8.onnx' | Select-Object -First 1
            Copy-Item $src.FullName $modelFile -Force
            $tok = Get-ChildItem $modelRoot -Recurse -Filter 'tokens.txt' | Select-Object -First 1
            Copy-Item $tok.FullName $tokensFile -Force
          }
          Write-Host "ASR model bytes: $((Get-Item $modelFile).Length)"
          $wav = Join-Path $env:TEMP 'astella-asr.wav'
          Add-Type -AssemblyName System.Speech
          $synth = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $fmt = New-Object System.Speech.AudioFormat.SpeechAudioFormatInfo(16000, [System.Speech.AudioFormat.AudioBitsPerSample]::Sixteen, [System.Speech.AudioFormat.AudioChannel]::Mono)
          $synth.SetOutputToWaveFile($wav, $fmt)
          $synth.Speak('Hello, this is Astella. Please open the notebook.')
          $synth.Dispose()
          $env:ASTELLA_ASR_REHEARSAL = $wav
          $asrProc = Start-Process -FilePath $exe -PassThru -WorkingDirectory (Split-Path $exe)
          Wait-Process -Id $asrProc.Id -Timeout 240 -ErrorAction SilentlyContinue
          Remove-Item Env:ASTELLA_ASR_REHEARSAL
          Write-Host 'startup.log (after ASR):'
          Get-Content $logPath | ForEach-Object { Write-Host "  $_" }
          $uninstall = Join-Path $env:LOCALAPPDATA 'Astella\uninstall.exe'
          if (Test-Path $uninstall) { Start-Process -FilePath $uninstall -ArgumentList '/S' -Wait }
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: astella-tauri-windows
          path: apps/desktop-tauri/dist/**
          if-no-files-found: error
          retention-days: 14
